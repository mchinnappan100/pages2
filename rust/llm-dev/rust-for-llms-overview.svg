      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <!-- Footer gradient line -->
    <linearGradient id="footerLine" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8630a"/>
      <stop offset="33%" stop-color="#58a6ff"/>
      <stop offset="66%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#d9a84a"/>
    </linearGradient>
    <!-- Part I card gradient -->
    <linearGradient id="cardI" x1="0" y1="0" x2="0" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1408"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <!-- Part II card gradient -->
    <linearGradient id="cardII" x1="0" y1="0" x2="0" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#091525"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <!-- Part III card gradient -->
    <linearGradient id="cardIII" x1="0" y1="0" x2="0" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#091608"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <!-- Part IV card gradient -->
    <linearGradient id="cardIV" x1="0" y1="0" x2="0" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1508"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <!-- Clip for cards -->
    <clipPath id="card1clip"><rect x="482" y="20" width="338" height="290" rx="10"/></clipPath>
    <clipPath id="card2clip"><rect x="840" y="20" width="338" height="290" rx="10"/></clipPath>
    <clipPath id="card3clip"><rect x="482" y="332" width="338" height="290" rx="10"/></clipPath>
    <clipPath id="card4clip"><rect x="840" y="332" width="338" height="290" rx="10"/></clipPath>
