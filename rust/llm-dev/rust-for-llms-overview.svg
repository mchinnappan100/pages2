  <rect x="32" y="458" width="408" height="1" fill="#30363d"/>

  <!-- KPI 1: Exercises / 12 chapters -->
  <rect x="32"  y="466" width="90" height="62" rx="6" fill="rgba(255,255,255,0.03)" stroke="#30363d" stroke-width="1"/>
  <text x="43"  y="480" font-size="9"  fill="#6e7681"  font-weight="700" letter-spacing="1.5">EXERCISES</text>
  <text x="43"  y="502" font-size="22" fill="#c9d1d9"  font-weight="900">48+</text>
  <text x="43"  y="518" font-size="9"  fill="#8b949e">12 chapters</text>

  <!-- KPI 2: Parameters -->
  <rect x="134" y="466" width="90" height="62" rx="6" fill="rgba(255,255,255,0.03)" stroke="#30363d" stroke-width="1"/>
  <text x="145" y="480" font-size="9"  fill="#6e7681"  font-weight="700" letter-spacing="1.5">PARAMETERS</text>
  <text x="145" y="502" font-size="22" fill="#c9d1d9"  font-weight="900">5M</text>
  <text x="145" y="518" font-size="9"  fill="#8b949e">max model</text>

  <!-- KPI 3: Milestones -->
  <rect x="236" y="466" width="90" height="62" rx="6" fill="rgba(255,255,255,0.03)" stroke="#30363d" stroke-width="1"/>
  <text x="247" y="480" font-size="9"  fill="#6e7681"  font-weight="700" letter-spacing="1.5">MILESTONES</text>
  <text x="247" y="502" font-size="22" fill="#c9d1d9"  font-weight="900">3</text>
  <text x="247" y="518" font-size="9"  fill="#8b949e">deliverables</text>

  <!-- KPI 4: Source -->
  <rect x="338" y="466" width="90" height="62" rx="6" fill="rgba(255,255,255,0.03)" stroke="#30363d" stroke-width="1"/>
  <text x="349" y="480" font-size="9"  fill="#6e7681"  font-weight="700" letter-spacing="1.5">SOURCE</text>
  <text x="349" y="502" font-size="22" fill="#e8630a"  font-weight="900">100%</text>
  <text x="349" y="518" font-size="9"  fill="#8b949e">pure Rust</text>

  <!-- Project name highlight box -->
  <rect x="32" y="542" width="408" height="52" rx="8" fill="rgba(232,99,10,0.08)" stroke="rgba(232,99,10,0.4)" stroke-width="1"/>
  <text x="52" y="563" font-size="10" fill="#e8630a" font-weight="700" letter-spacing="1.5">THE RUNNING PROJECT</text>
  <text x="52" y="583" font-size="17" fill="#f0a040" font-weight="800">TinyRustGPT</text>
  <text x="175" y="583" font-size="12" fill="#8b949e"> — from random weights to inference</text>

  <!-- Tagline -->
  <text x="32" y="622" font-size="11" fill="#6e7681" font-style="italic">"No black boxes. No pretrained weights. Every line explained."</text>

  <!-- URL/author area -->
  <text x="32" y="650" font-size="10" fill="#6e7681">github.com/tiny-rust-llm</text>

