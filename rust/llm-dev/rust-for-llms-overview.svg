  <text x="544" y="109" font-size="13" fill="#c9d1d9" font-weight="600">Why Rust for LLMs?</text>
  <text x="544" y="125" font-size="10.5" fill="#6e7681">Memory safety, Candle setup, first tensor op</text>
  <!-- Chapter 2 -->
  <circle cx="516" cy="183" r="17" fill="rgba(232,99,10,0.2)" stroke="#e8630a" stroke-width="1.5"/>
  <text x="516" y="188" font-size="10" fill="#e8630a" font-weight="800" text-anchor="middle">02</text>
  <text x="544" y="178" font-size="13" fill="#c9d1d9" font-weight="600">Tensors &amp; Matrix Operations</text>
  <text x="544" y="194" font-size="10.5" fill="#6e7681">Rank, shape, BF16, softmax, broadcasting</text>
  <!-- Chapter 3 -->
  <circle cx="516" cy="252" r="17" fill="rgba(232,99,10,0.2)" stroke="#e8630a" stroke-width="1.5"/>
