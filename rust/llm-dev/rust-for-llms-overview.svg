  <!-- Chapter 5 -->
  <circle cx="874" cy="183" r="17" fill="rgba(88,166,255,0.15)" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="874" y="188" font-size="10" fill="#58a6ff" font-weight="800" text-anchor="middle">05</text>
  <text x="902" y="178" font-size="13" fill="#c9d1d9" font-weight="600">The Transformer Architecture</text>
  <text x="902" y="194" font-size="10.5" fill="#6e7681">Self-attention, Q/K/V, causal mask, MHA</text>
  <!-- Chapter 6 -->
  <circle cx="874" cy="252" r="17" fill="rgba(88,166,255,0.15)" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="874" y="257" font-size="10" fill="#58a6ff" font-weight="800" text-anchor="middle">06</text>
  <text x="902" y="247" font-size="13" fill="#c9d1d9" font-weight="600">Building Tiny GPT</text>
  <text x="902" y="263" font-size="10.5" fill="#6e7681">Embeddings, N blocks, LM head, 847K–5M</text>

