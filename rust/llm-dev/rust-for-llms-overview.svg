  <text x="544" y="559" font-size="13" fill="#c9d1d9" font-weight="600">Checkpoints &amp; Evaluation</text>
  <text x="544" y="575" font-size="10.5" fill="#6e7681">Safetensors, perplexity, early stopping</text>

