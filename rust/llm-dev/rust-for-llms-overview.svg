  <!-- ═══════════════ BACKGROUND ═══════════════ -->
  <rect width="1200" height="675" fill="url(#bgMain)"/>
  <rect width="1200" height="675" fill="url(#warmGlow)"/>
  <rect width="1200" height="675" fill="url(#coolGlow)"/>

  <!-- Subtle dot grid on left panel -->
  <g opacity="0.08">
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#8b949e"/>
    </pattern>
    <rect x="0" y="0" width="462" height="675" fill="url(#dots)"/>
  </g>

  <!-- ═══════════════ LEFT PANEL ═══════════════ -->
  <!-- Orange accent bar on far left -->
  <rect x="0" y="0" width="4" height="675" fill="#e8630a"/>

  <!-- Crab emoji -->
  <text x="32" y="92" font-size="72" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">🦀</text>

  <!-- Main title -->
  <text x="32" y="168" font-size="74" font-weight="800" letter-spacing="-1" fill="#e8630a">RUST</text>
  <text x="32" y="225" font-size="54" font-weight="800" letter-spacing="-1" fill="#c9d1d9">FOR <tspan fill="#e8630a">LLMs</tspan></text>

  <!-- Subtitle -->
  <text x="32" y="257" font-size="13.5" fill="#8b949e">Building, Training &amp; Running Language Models</text>
  <text x="32" y="276" font-size="13.5" fill="#8b949e">with <tspan fill="#58a6ff">Hugging Face Candle</tspan></text>

  <!-- Divider line under subtitle -->
  <line x1="32" y1="296" x2="260" y2="296" stroke="#e8630a" stroke-width="2" stroke-linecap="round"/>
  <line x1="268" y1="296" x2="440" y2="296" stroke="#30363d" stroke-width="1"/>

  <!-- Description bullets -->
  <text x="32" y="325" font-size="12.5" fill="#6e7681">▶</text>
  <text x="48" y="325" font-size="12.5" fill="#c9d1d9">Build a 847K–5M parameter decoder-only GPT</text>

  <text x="32" y="347" font-size="12.5" fill="#6e7681">▶</text>
  <text x="48" y="347" font-size="12.5" fill="#c9d1d9">Train from scratch — no pretrained weights</text>

  <text x="32" y="369" font-size="12.5" fill="#6e7681">▶</text>
  <text x="48" y="369" font-size="12.5" fill="#c9d1d9">Metal GPU on Apple Silicon M3 &amp; M5</text>

  <text x="32" y="391" font-size="12.5" fill="#6e7681">▶</text>
  <text x="48" y="391" font-size="12.5" fill="#c9d1d9">KV cache, INT8 quant, HTTP API, PyO3</text>

  <!-- Tech badges -->
  <!-- Badge: Rust -->
  <rect x="32" y="415" width="96" height="30" rx="6" fill="rgba(206,66,43,0.15)" stroke="#ce422b" stroke-width="1"/>
  <text x="52" y="435" font-size="13" fill="#f0a99e" font-weight="700">🦀 Rust</text>

  <!-- Badge: Candle -->
  <rect x="136" y="415" width="118" height="30" rx="6" fill="rgba(88,166,255,0.1)" stroke="#58a6ff" stroke-width="1"/>
  <text x="156" y="435" font-size="13" fill="#9ecbff" font-weight="700">⚡ Candle</text>

  <!-- Badge: Metal -->
  <rect x="262" y="415" width="136" height="30" rx="6" fill="rgba(63,185,80,0.1)" stroke="#3fb950" stroke-width="1"/>
  <text x="282" y="435" font-size="13" fill="#9be3a3" font-weight="700">🍎 Metal GPU</text>

