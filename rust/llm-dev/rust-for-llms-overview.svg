<svg width="1200" height="675" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','SF Pro Display',Arial,Helvetica,sans-serif">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgMain" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <!-- Warm glow top-left -->
    <radialGradient id="warmGlow" cx="0" cy="0" r="520" gradientUnits="userSpaceOnUse">
