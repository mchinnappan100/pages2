  <!-- Chapter 8 -->
  <circle cx="516" cy="495" r="17" fill="rgba(63,185,80,0.15)" stroke="#3fb950" stroke-width="1.5"/>
  <text x="516" y="500" font-size="10" fill="#3fb950" font-weight="800" text-anchor="middle">08</text>
  <text x="544" y="490" font-size="13" fill="#c9d1d9" font-weight="600">Apple Silicon: M3 &amp; M5</text>
  <text x="544" y="506" font-size="10.5" fill="#6e7681">Metal GPU, unified memory, 10–22× speedup</text>
  <!-- Chapter 9 -->
  <circle cx="516" cy="564" r="17" fill="rgba(63,185,80,0.15)" stroke="#3fb950" stroke-width="1.5"/>
