<svg viewBox="0 0 850 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="850" height="300" fill="#ffffff"/>
  <text x="425" y="35" font-family="Helvetica, Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Three Stages of Building an LLM</text>

  <!-- Stage 1 -->
  <rect x="40" y="90" width="220" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="125" font-family="Helvetica, Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Pretraining</text>
  <text x="150" y="150" font-family="Helvetica, Arial" font-size="12" text-anchor="middle" fill="#1e3a8a">Trillions of tokens</text>
  <text x="150" y="170" font-family="Helvetica, Arial" font-size="12" text-anchor="middle" fill="#1e3a8a">Thousands of GPUs</text>
  <text x="150" y="190" font-family="Helvetica, Arial" font-size="12" font-weight="600" text-anchor="middle" fill="#1e3a8a">$$$$ Highest cost</text>

  <!-- Stage 2 -->
  <rect x="315" y="90" width="220" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="425" y="125" font-family="Helvetica, Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#14532d">Instruction Tuning</text>
  <text x="425" y="150" font-family="Helvetica, Arial" font-size="12" text-anchor="middle" fill="#14532d">Curated Q&amp;A pairs</text>
  <text x="425" y="170" font-family="Helvetica, Arial" font-size="12" text-anchor="middle" fill="#14532d">Supervised fine-tuning</text>
  <text x="425" y="190" font-family="Helvetica, Arial" font-size="12" font-weight="600" text-anchor="middle" fill="#14532d">$$ Moderate cost</text>

  <!-- Stage 3 -->
  <rect x="590" y="90" width="220" height="120" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="700" y="125" font-family="Helvetica, Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#7f1d1d">Post-training</text>
  <text x="700" y="150" font-family="Helvetica, Arial" font-size="12" text-anchor="middle" fill="#7f1d1d">RLHF / RLAIF / DPO</text>
  <text x="700" y="170" font-family="Helvetica, Arial" font-size="12" text-anchor="middle" fill="#7f1d1d">Human preference labels</text>
  <text x="700" y="190" font-family="Helvetica, Arial" font-size="12" font-weight="600" text-anchor="middle" fill="#7f1d1d">$$$ Labor-intensive</text>

  <!-- arrows -->
  <line x1="260" y1="150" x2="315" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="535" y1="150" x2="590" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#a1)"/>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#374151"/>
    </marker>
  </defs>
</svg>
