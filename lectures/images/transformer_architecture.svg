<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="480" fill="#ffffff"/>

  <!-- Encoder stack -->
  <text x="180" y="40" font-family="Helvetica, Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Encoder</text>
  <g>
    <rect x="80" y="200" width="200" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="180" y="235" font-family="Helvetica, Arial" font-size="15" text-anchor="middle" fill="#1e3a8a">Feed Forward</text>

    <rect x="80" y="130" width="200" height="60" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
    <text x="180" y="165" font-family="Helvetica, Arial" font-size="15" text-anchor="middle" fill="#1e3a8a">Self-Attention</text>

    <rect x="80" y="60" width="200" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="180" y="90" font-family="Helvetica, Arial" font-size="14" text-anchor="middle" fill="#1e3a8a">Input Embedding + Position</text>

    <line x1="180" y1="110" x2="180" y2="130" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="180" y1="190" x2="180" y2="200" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="60" y="45" width="240" height="230" rx="12" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="180" y="300" font-family="Helvetica, Arial" font-size="13" text-anchor="middle" fill="#3b82f6">x N layers</text>
  </g>

  <!-- Decoder stack -->
  <text x="600" y="40" font-family="Helvetica, Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Decoder</text>
  <g>
    <rect x="500" y="230" width="200" height="55" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="600" y="263" font-family="Helvetica, Arial" font-size="15" text-anchor="middle" fill="#7f1d1d">Feed Forward</text>

    <rect x="500" y="165" width="200" height="55" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
    <text x="600" y="198" font-family="Helvetica, Arial" font-size="14" text-anchor="middle" fill="#7f1d1d">Cross-Attention</text>

    <rect x="500" y="100" width="200" height="55" rx="8" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
    <text x="600" y="133" font-family="Helvetica, Arial" font-size="14" text-anchor="middle" fill="#7f1d1d">Masked Self-Attention</text>

    <rect x="500" y="45" width="200" height="45" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="600" y="72" font-family="Helvetica, Arial" font-size="13" text-anchor="middle" fill="#7f1d1d">Output Embedding + Position</text>

    <line x1="600" y1="90" x2="600" y2="100" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow2)"/>
    <line x1="600" y1="155" x2="600" y2="165" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow2)"/>
    <line x1="600" y1="220" x2="600" y2="230" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow2)"/>
    <rect x="480" y="30" width="240" height="270" rx="12" fill="none" stroke="#fca5a5" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="600" y="315" font-family="Helvetica, Arial" font-size="13" text-anchor="middle" fill="#dc2626">x N layers</text>
  </g>

  <!-- Connection encoder -> decoder -->
  <line x1="280" y1="160" x2="500" y2="192" stroke="#6b7280" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow3)"/>
  <text x="390" y="150" font-family="Helvetica, Arial" font-size="12" text-anchor="middle" fill="#6b7280">encoded context</text>

  <!-- Output -->
  <rect x="500" y="350" width="200" height="45" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="600" y="377" font-family="Helvetica, Arial" font-size="14" text-anchor="middle" fill="#111827">Output Probabilities</text>
  <line x1="600" y1="285" x2="600" y2="350" stroke="#374151" stroke-width="2" marker-end="url(#arrow4)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arrow4" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#374151"/>
    </marker>
  </defs>
</svg>
