<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="320" fill="#ffffff"/>
  <text x="400" y="35" font-family="Helvetica, Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Self-Attention: Every token looks at every other token</text>

  <!-- tokens -->
  <g font-family="Helvetica, Arial" font-size="15" font-weight="600">
    <rect x="60"  y="230" width="110" height="45" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="115" y="258" text-anchor="middle" fill="#1e3a8a">"The"</text>

    <rect x="210" y="230" width="110" height="45" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="265" y="258" text-anchor="middle" fill="#1e3a8a">"cat"</text>

    <rect x="360" y="230" width="110" height="45" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="3"/>
    <text x="415" y="258" text-anchor="middle" fill="#78350f">"sat"</text>

    <rect x="510" y="230" width="110" height="45" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="565" y="258" text-anchor="middle" fill="#1e3a8a">"on"</text>

    <rect x="660" y="230" width="110" height="45" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="715" y="258" text-anchor="middle" fill="#1e3a8a">"mat"</text>
  </g>

  <!-- attention lines from "sat" to all tokens, varying thickness = weight -->
  <line x1="415" y1="230" x2="115" y2="275" stroke="#d97706" stroke-width="1.5" opacity="0.5"/>
  <line x1="415" y1="230" x2="265" y2="275" stroke="#d97706" stroke-width="4" opacity="0.8"/>
  <line x1="415" y1="230" x2="415" y2="275" stroke="#d97706" stroke-width="2" opacity="0.6"/>
  <line x1="415" y1="230" x2="565" y2="275" stroke="#d97706" stroke-width="2" opacity="0.6"/>
  <line x1="415" y1="230" x2="715" y2="275" stroke="#d97706" stroke-width="3" opacity="0.7"/>

  <text x="400" y="120" font-family="Helvetica, Arial" font-size="13" text-anchor="middle" fill="#78350f">line thickness ≈ attention weight</text>
  <text x="400" y="145" font-family="Helvetica, Arial" font-size="13" text-anchor="middle" fill="#6b7280">"sat" attends most strongly to "cat" and "mat" — building context, not just word order</text>
</svg>
