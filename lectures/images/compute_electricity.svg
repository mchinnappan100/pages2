<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="320" fill="#ffffff"/>
  <text x="400" y="35" font-family="Helvetica, Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">The AI Growth Stack</text>

  <!-- layered pyramid -->
  <polygon points="400,60 250,140 550,140" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="400" y="105" font-family="Helvetica, Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#78350f">AI Models</text>

  <polygon points="250,140 550,140 610,220 190,220" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="185" font-family="Helvetica, Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Compute (GPUs / TPUs)</text>

  <polygon points="190,220 610,220 670,300 130,300" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="400" y="265" font-family="Helvetica, Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#7f1d1d">Electricity &amp; Power Infrastructure</text>

  <text x="400" y="315" font-family="Helvetica, Arial" font-size="12" text-anchor="middle" fill="#6b7280">Each layer depends entirely on the one beneath it</text>
</svg>
