<svg viewBox="0 0 820 340" xmlns="http://www.w3.org/2000/svg">
  <rect width="820" height="340" fill="#ffffff"/>
  <text x="410" y="35" font-family="Helvetica, Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Interpretability: Opening the Black Box</text>

  <!-- Input -->
  <rect x="30" y="140" width="130" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="95" y="173" font-family="Helvetica, Arial" font-size="13" text-anchor="middle" fill="#1e3a8a">Input Prompt</text>

  <!-- Black box -->
  <rect x="230" y="90" width="360" height="160" rx="14" fill="#111827"/>
  <text x="410" y="130" font-family="Helvetica, Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#f9fafb">Model Internals</text>
  <text x="410" y="150" font-family="Helvetica, Arial" font-size="11" text-anchor="middle" fill="#9ca3af">billions of parameters,</text>
  <text x="410" y="167" font-family="Helvetica, Arial" font-size="11" text-anchor="middle" fill="#9ca3af">attention heads, neurons —</text>
  <text x="410" y="184" font-family="Helvetica, Arial" font-size="11" text-anchor="middle" fill="#9ca3af">mostly opaque by default</text>

  <!-- magnifying glass over the box -->
  <circle cx="410" cy="215" r="18" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <line x1="423" y1="228" x2="435" y2="240" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>

  <!-- Output -->
  <rect x="660" y="140" width="130" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="725" y="173" font-family="Helvetica, Arial" font-size="13" text-anchor="middle" fill="#14532d">Output</text>

  <line x1="160" y1="167" x2="230" y2="167" stroke="#374151" stroke-width="2" marker-end="url(#c1)"/>
  <line x1="590" y1="167" x2="660" y2="167" stroke="#374151" stroke-width="2" marker-end="url(#c1)"/>

  <!-- interpretability techniques below -->
  <rect x="230" y="280" width="360" height="1" fill="#e5e7eb"/>
  <text x="270" y="270" font-family="Helvetica, Arial" font-size="11" fill="#78350f">Probing</text>
  <text x="360" y="270" font-family="Helvetica, Arial" font-size="11" fill="#78350f">Circuit tracing</text>
  <text x="470" y="270" font-family="Helvetica, Arial" font-size="11" fill="#78350f">Sparse autoencoders</text>

  <defs>
    <marker id="c1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#374151"/></marker>
  </defs>
</svg>
