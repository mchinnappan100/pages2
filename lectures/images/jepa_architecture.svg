<svg viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg">
  <rect width="820" height="380" fill="#ffffff"/>
  <text x="410" y="35" font-family="Helvetica, Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">JEPA: Joint Embedding Predictive Architecture</text>

  <!-- Context input -->
  <rect x="40" y="90" width="160" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="123" font-family="Helvetica, Arial" font-size="14" text-anchor="middle" fill="#1e3a8a">Context (visible part)</text>

  <!-- Target input -->
  <rect x="40" y="260" width="160" height="55" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="120" y="293" font-family="Helvetica, Arial" font-size="14" text-anchor="middle" fill="#7f1d1d">Target (masked part)</text>

  <!-- Encoders -->
  <rect x="300" y="90" width="150" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="375" y="123" font-family="Helvetica, Arial" font-size="14" text-anchor="middle" fill="#1e3a8a">Context Encoder</text>

  <rect x="300" y="260" width="150" height="55" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="375" y="293" font-family="Helvetica, Arial" font-size="14" text-anchor="middle" fill="#7f1d1d">Target Encoder</text>

  <!-- Predictor -->
  <rect x="540" y="130" width="160" height="120" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <text x="620" y="195" font-family="Helvetica, Arial" font-size="15" font-weight="bold" text-anchor="middle" fill="#78350f">Predictor</text>
  <text x="620" y="215" font-family="Helvetica, Arial" font-size="11" text-anchor="middle" fill="#78350f">predicts target embedding</text>
  <text x="620" y="230" font-family="Helvetica, Arial" font-size="11" text-anchor="middle" fill="#78350f">from context embedding</text>

  <!-- comparison -->
  <circle cx="760" cy="190" r="28" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="760" y="195" font-family="Helvetica, Arial" font-size="20" text-anchor="middle" fill="#111827">≈?</text>

  <!-- arrows -->
  <line x1="200" y1="117" x2="300" y2="117" stroke="#2563eb" stroke-width="2" marker-end="url(#b1)"/>
  <line x1="200" y1="287" x2="300" y2="287" stroke="#dc2626" stroke-width="2" marker-end="url(#b2)"/>
  <line x1="450" y1="130" x2="540" y2="170" stroke="#2563eb" stroke-width="2" marker-end="url(#b1)"/>
  <line x1="700" y1="180" x2="732" y2="185" stroke="#d97706" stroke-width="2" marker-end="url(#b3)"/>
  <line x1="450" y1="287" x2="760" y2="220" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#b2)"/>

  <text x="410" y="350" font-family="Helvetica, Arial" font-size="12" text-anchor="middle" fill="#6b7280">Predicts in representation space (not pixels/tokens) — learns "what matters," discards noise</text>

  <defs>
    <marker id="b1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="b2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/></marker>
    <marker id="b3" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/></marker>
  </defs>
</svg>
