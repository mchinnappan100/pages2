
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You Card Generator</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: Georgia, serif; }
  .card {
    min-height: 480px;
    transition: all .3s ease;
    background: linear-gradient(145deg,#fff7ed,#fce7f3);
  }
  .card.blue {
    background: linear-gradient(145deg,#eff6ff,#dbeafe);
  }
  .card.green {
    background: linear-gradient(145deg,#ecfdf5,#d1fae5);
  }
  .card.purple {
    background: linear-gradient(145deg,#faf5ff,#ede9fe);
  }
  .card.dark {
    background: linear-gradient(145deg,#292524,#57534e);
    color: #fff7ed;
  }
  .card.dark .message { color: #e7e5e4; }
  .card.dark .signature { color: #fcd34d; }
  .ornament { color: #d97706; }
  @media print {
    body * { visibility: hidden; }
    #preview, #preview * { visibility: visible; }
    #preview {
      position: absolute;
      left: 0; top: 0;
      width: 100%;
      box-shadow: none;
    }
    .card { min-height: 650px; }
  }
</style>
</head>

<body class="bg-slate-100 min-h-screen">

<header class="bg-gradient-to-r from-rose-700 to-purple-800 text-white p-6 shadow-lg">
  <div class="max-w-7xl mx-auto">
    <h1 class="text-3xl md:text-4xl font-bold">💌 Thank You Card Studio</h1>
    <p class="mt-2 text-rose-100">A little gratitude goes a long way. Create something beautiful!</p>
  </div>
</header>

<main class="max-w-7xl mx-auto p-5 md:p-8">
<div class="grid lg:grid-cols-2 gap-8">

<!-- Editor -->
<section class="bg-white rounded-2xl shadow-lg p-6">
  <h2 class="text-2xl font-bold text-slate-800 mb-5">✍️ Design Your Card</h2>

  <label class="block font-semibold mb-1">Recipient's Name</label>
  <input id="recipient" value="Dear Friend"
    class="w-full border rounded-lg p-3 mb-4 focus:ring-2 focus:ring-rose-400 outline-none">

  <label class="block font-semibold mb-1">Card Heading</label>
  <input id="heading" value="Thank You!"
    class="w-full border rounded-lg p-3 mb-4">

  <label class="block font-semibold mb-1">Your Message</label>
  <textarea id="message" rows="5"
    class="w-full border rounded-lg p-3 mb-4">Your kindness, generosity, and thoughtfulness mean so much to me.

Thank you for being such a wonderful part of my life. I truly appreciate everything you have done!</textarea>

  <label class="block font-semibold mb-1">From</label>
  <input id="sender" value="With gratitude, Mohan"
    class="w-full border rounded-lg p-3 mb-4">

  <label class="block font-semibold mb-2">Choose a Theme</label>
  <div class="grid grid-cols-5 gap-2 mb-5">
    <button onclick="setTheme('')" class="rounded-lg p-3 bg-rose-100 hover:ring-2 ring-rose-500" title="Rose">🌸</button>
    <button onclick="setTheme('blue')" class="rounded-lg p-3 bg-blue-100 hover:ring-2 ring-blue-500" title="Blue">💙</button>
    <button onclick="setTheme('green')" class="rounded-lg p-3 bg-green-100 hover:ring-2 ring-green-500" title="Green">🍃</button>
    <button onclick="setTheme('purple')" class="rounded-lg p-3 bg-purple-100 hover:ring-2 ring-purple-500" title="Purple">💜</button>
    <button onclick="setTheme('dark')" class="rounded-lg p-3 bg-stone-700 text-white hover:ring-2 ring-amber-400" title="Elegant">✨</button>
  </div>

  <label class="block font-semibold mb-2">Decorative Symbol</label>
  <div class="flex flex-wrap gap-2 mb-6">
    <button onclick="setSymbol('🌸')" class="p-2 bg-slate-100 rounded-lg text-xl">🌸</button>
    <button onclick="setSymbol('❤️')" class="p-2 bg-slate-100 rounded-lg text-xl">❤️</button>
    <button onclick="setSymbol('🌻')" class="p-2 bg-slate-100 rounded-lg text-xl">🌻</button>
    <button onclick="setSymbol('🙏')" class="p-2 bg-slate-100 rounded-lg text-xl">🙏</button>
    <button onclick="setSymbol('💐')" class="p-2 bg-slate-100 rounded-lg text-xl">💐</button>
    <button onclick="setSymbol('🦋')" class="p-2 bg-slate-100 rounded-lg text-xl">🦋</button>
    <button onclick="setSymbol('⭐')" class="p-2 bg-slate-100 rounded-lg text-xl">⭐</button>
  </div>

  <div class="flex flex-wrap gap-3">
    <button onclick="copyMessage()"
      class="flex-1 bg-slate-800 text-white p-3 rounded-xl hover:bg-slate-700">
      📋 Copy Text
    </button>
    <button onclick="window.print()"
      class="flex-1 bg-rose-600 text-white p-3 rounded-xl hover:bg-rose-700">
      🖨️ Print / PDF
    </button>
    <button onclick="downloadHTML()"
      class="flex-1 bg-purple-700 text-white p-3 rounded-xl hover:bg-purple-800">
      ⬇️ Download Card
    </button>
  </div>
  <p id="status" class="text-sm text-green-700 mt-3"></p>
</section>

<!-- Preview -->
<section>
  <h2 class="text-2xl font-bold text-slate-800 mb-5">👀 Live Preview</h2>

  <div id="preview" class="card rounded-3xl shadow-2xl overflow-hidden border-8 border-white">
    <div class="min-h-[480px] flex flex-col justify-center items-center text-center p-8 md:p-12">

      <div class="text-6xl mb-5" id="symbol">🌸</div>

      <div class="ornament text-2xl tracking-widest mb-5">✦ ───── ✦</div>

      <p id="previewRecipient" class="text-xl italic mb-5">Dear Friend</p>

      <h2 id="previewHeading"
        class="text-5xl font-bold text-rose-700 mb-6">
        Thank You!
      </h2>

      <div class="ornament text-2xl mb-6">❦</div>

      <p id="previewMessage"
        class="message text-lg leading-9 text-slate-700 whitespace-pre-line max-w-lg">
      </p>

      <div class="ornament text-2xl mt-7 mb-4">✦</div>

      <p id="previewSender"
        class="signature text-xl italic font-bold text-rose-700">
        With gratitude, Mohan
      </p>

      <div class="text-2xl mt-8 tracking-widest">♡ ✨ ♡</div>
    </div>
  </div>

  <p class="text-center text-slate-500 text-sm mt-4">
    Made with ❤️ and gratitude
  </p>
</section>
</div>
</main>

<footer class="text-center p-6 text-slate-500 text-sm">
  Thank You Card Studio · Spread kindness, one card at a time.
</footer>

<script>
let theme = "";
let symbol = "🌸";

const fields = ["recipient","heading","message","sender"];

function updatePreview() {
  document.getElementById("previewRecipient").textContent =
    document.getElementById("recipient").value;

  document.getElementById("previewHeading").textContent =
    document.getElementById("heading").value;

  document.getElementById("previewMessage").textContent =
    document.getElementById("message").value;

  document.getElementById("previewSender").textContent =
    document.getElementById("sender").value;
}

fields.forEach(id => {
  document.getElementById(id).addEventListener("input", updatePreview);
});

function setTheme(value) {
  theme = value;
  document.getElementById("preview").className =
    "card " + theme + " rounded-3xl shadow-2xl overflow-hidden border-8 border-white";
}

function setSymbol(value) {
  symbol = value;
  document.getElementById("symbol").textContent = symbol;
}

function getMessage() {
  return `${document.getElementById("recipient").value}

${document.getElementById("heading").value}

${document.getElementById("message").value}

${document.getElementById("sender").value}`;
}

async function copyMessage() {
  try {
    await navigator.clipboard.writeText(getMessage());
    showStatus("Card message copied!");
  } catch {
    showStatus("Clipboard unavailable. Please copy the text manually.");
  }
}

function showStatus(text) {
  document.getElementById("status").textContent = text;
}

function downloadHTML() {
  const card = document.getElementById("preview").outerHTML;
  const css = document.querySelector("style").textContent;

  const html = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Thank You Card</title>
<script src="https://cdn.tailwindcss.com"><\/script>
<style>${css}</style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-6">
${card}
</body>
</html>`;

  const blob = new Blob([html], {type:"text/html"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "thank-you-card.html";
  a.click();
  URL.revokeObjectURL(url);
  showStatus("Your card has been downloaded!");
}

updatePreview();
</script>
</body>
</html>
