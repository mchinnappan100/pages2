<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gandhi Quote T-Shirt Designer</title>
  <link rel="icon" type="image/x-icon" href="https://mohan-chinnappan-n5.github.io/dfv/img/mc_favIcon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,700;1,300&family=DM+Sans:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#f9f5ed;--bg2:#fff;--text:#1a1208;--muted:#7a6a50;
      --border:rgba(26,18,8,.1);--accent:#b5711d;--shadow:0 4px 24px rgba(26,18,8,.07);
    }
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

    nav{
      position:sticky;top:0;z-index:50;
      background:rgba(249,245,237,.92);backdrop-filter:blur(14px);
      border-bottom:1px solid var(--border);
      height:58px;display:flex;align-items:center;justify-content:space-between;
      padding:0 2rem;
    }
    .nav-brand{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:10px}
    .brand-dot{width:28px;height:28px;border-radius:7px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:.9rem;font-weight:700}
    .btn{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:100px;padding:6px 16px;font-size:.8rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:.15s}
    .btn:hover{background:var(--border)}
    .btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}
    .btn-accent:hover{opacity:.9}

    .designer{max-width:1200px;margin:0 auto;padding:2rem;display:grid;grid-template-columns:1fr 340px;gap:2rem;align-items:start}
    @media(max-width:860px){.designer{grid-template-columns:1fr;padding:1rem}}

    .canvas-wrap{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
    .shirt-frame{position:relative;display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:.5rem}
    .shirt-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}

    .shirt-svg{filter:drop-shadow(0 8px 24px rgba(0,0,0,.15));cursor:default;transition:filter .2s}
    .shirt-body{transition:fill .3s}

    .panel{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:1.5rem;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:1.2rem}
    .panel-section{display:flex;flex-direction:column;gap:.6rem}
    .panel-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}
    .panel-row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
    .swatch{width:28px;height:28px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:transform .15s,border-color .15s;flex-shrink:0}
    .swatch:hover{transform:scale(1.15)}
    .swatch.active{border-color:var(--accent);transform:scale(1.1)}
    .color-input{width:36px;height:28px;padding:0;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:transparent}
    input[type=range]{width:100%;accent-color:var(--accent)}

    .chip-row{display:flex;gap:6px;flex-wrap:wrap}
    .chip{padding:4px 12px;border-radius:100px;font-size:.72rem;font-weight:600;cursor:pointer;border:1px solid var(--border);color:var(--muted);background:transparent;transition:.15s;font-family:'DM Sans',sans-serif}
    .chip:hover{border-color:var(--accent);color:var(--accent)}
    .chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

    .quote-search{padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg2);color:var(--text);font-family:'DM Sans',sans-serif;font-size:.85rem;outline:none;width:100%}
    .quote-search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(181,113,29,.1)}
    .quote-pick-list{max-height:210px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column}
    .quote-pick-item{padding:8px 12px;cursor:pointer;font-size:.78rem;border-bottom:1px solid var(--border);transition:.15s;line-height:1.5}
    .quote-pick-item:last-child{border-bottom:none}
    .quote-pick-item:hover,.quote-pick-item.active{background:rgba(181,113,29,.07);color:var(--accent)}
    .quote-pick-item .cat{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
    .quote-pick-item .qt{color:var(--text);font-style:italic}

    .img-upload-zone{
      border:2px dashed var(--border);border-radius:12px;padding:14px;text-align:center;
      cursor:pointer;transition:.2s;font-size:.78rem;color:var(--muted);
    }
    .img-upload-zone:hover{border-color:var(--accent);color:var(--accent)}
    .img-url-input{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg2);color:var(--text);font-family:'DM Sans',sans-serif;font-size:.78rem;outline:none;width:100%}
    .img-url-input:focus{border-color:var(--accent)}
    #img-preview{width:100%;max-height:90px;object-fit:contain;border-radius:8px;border:1px solid var(--border);display:none}
  </style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <div class="brand-dot">M</div>
    <span>Gandhi <em style="font-weight:300;font-style:italic;">T-Shirt Designer</em></span>
  </div>
  <div style="display:flex;gap:8px">
    <a href="mkg.html" class="btn">🕊 Gandhi Page</a>
    <button class="btn" onclick="randomQuote()">🎲 Random</button>
    <button class="btn btn-accent" onclick="downloadPNG('front')">⬇ Front PNG</button>
    <button class="btn btn-accent" onclick="downloadPNG('back')">⬇ Back PNG</button>
  </div>
</nav>

<div class="designer">

  <!-- CANVAS -->
  <div style="display:flex;flex-direction:column;gap:1.2rem">
    <div class="canvas-wrap" id="shirts-wrap">

      <!-- Front: portrait sketch -->
      <div class="shirt-frame">
        <div class="shirt-label">Front</div>
        <svg id="svg-front" class="shirt-svg" width="280" height="320" viewBox="0 0 280 320" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <clipPath id="shirt-clip-front">
              <path d="M60,40 L20,90 L55,110 L50,290 L230,290 L225,110 L260,90 L220,40
                       Q195,28 175,30 Q165,55 140,60 Q115,55 105,30 Q85,28 60,40Z"/>
            </clipPath>
            <linearGradient id="bot-grad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="transparent"/>
              <stop offset="100%" stop-color="rgba(0,0,0,0.6)"/>
            </linearGradient>
          </defs>

          <!-- shirt body (base colour) -->
          <path class="shirt-body" id="body-front"
            d="M60,40 L20,90 L55,110 L50,290 L230,290 L225,110 L260,90 L220,40
               Q195,28 175,30 Q165,55 140,60 Q115,55 105,30 Q85,28 60,40Z"
            fill="#b5711d" stroke="rgba(0,0,0,.1)" stroke-width="1"/>
          <path fill="none" stroke="rgba(0,0,0,.12)" stroke-width="2"
            d="M105,30 Q115,55 140,60 Q165,55 175,30"/>

          <!-- clipped group: image + gradient overlay stay inside shirt -->
          <g clip-path="url(#shirt-clip-front)">
            <image id="front-sketch"
              href="mkg-2.png"
              x="55" y="52" width="170" height="228"
              preserveAspectRatio="xMidYMid meet"
              style="mix-blend-mode:multiply;filter:contrast(1.2) brightness(0.95)"
              opacity="0.95"/>
            <rect x="20" y="235" width="240" height="60" fill="url(#bot-grad)"/>
          </g>

          <!-- text over gradient — no clip needed -->
          <text id="front-cat" x="140" y="270" font-size="7"
            fill="#ffffff" opacity=".85" text-anchor="middle" dominant-baseline="middle"
            font-family="DM Sans,sans-serif" font-weight="700" letter-spacing="2.5">MAHATMA GANDHI</text>
          <text id="front-year" x="140" y="283" font-size="6.5"
            fill="#ffffff" opacity=".5" text-anchor="middle" dominant-baseline="middle"
            font-family="DM Sans,sans-serif" letter-spacing="1">1869 – 1948</text>
        </svg>
      </div>

      <!-- Back: full quote -->
      <div class="shirt-frame">
        <div class="shirt-label">Back</div>
        <svg id="svg-back" class="shirt-svg" width="280" height="320" viewBox="0 0 280 320" xmlns="http://www.w3.org/2000/svg">
          <path class="shirt-body" id="body-back"
            d="M60,40 L20,90 L55,110 L50,290 L230,290 L225,110 L260,90 L220,40
               Q195,28 175,30 Q165,55 140,60 Q115,55 105,30 Q85,28 60,40Z"
            fill="#b5711d" stroke="rgba(0,0,0,.1)" stroke-width="1"/>
          <path fill="none" stroke="rgba(0,0,0,.12)" stroke-width="2"
            d="M105,30 Q115,55 140,60 Q165,55 175,30"/>
          <!-- watermark M -->
          <text x="140" y="180" font-size="130"
            fill="#000000" opacity=".04" text-anchor="middle" dominant-baseline="middle"
            font-family="Playfair Display,serif" font-weight="700">M</text>
          <!-- header label -->
          <text id="back-title" x="140" y="88" font-size="6.5"
            fill="#ffffff" opacity=".32" text-anchor="middle" dominant-baseline="middle"
            font-family="DM Sans,sans-serif" font-weight="700" letter-spacing="2.5">MAHATMA GANDHI</text>
          <!-- opening quote mark -->
          <text id="back-open-q" x="70" y="108" font-size="28"
            fill="#ffffff" opacity=".12" text-anchor="middle" dominant-baseline="middle"
            font-family="Playfair Display,serif">"</text>
          <!-- quote lines -->
          <text id="back-c1" x="140" y="118" font-size="10"
            fill="#ffd580" text-anchor="middle" dominant-baseline="middle"
            font-family="Playfair Display,serif" font-style="italic"></text>
          <text id="back-c2" x="140" y="135" font-size="10"
            fill="#ffd580" text-anchor="middle" dominant-baseline="middle"
            font-family="Playfair Display,serif" font-style="italic"></text>
          <text id="back-c3" x="140" y="152" font-size="10"
            fill="#ffd580" text-anchor="middle" dominant-baseline="middle"
            font-family="Playfair Display,serif" font-style="italic"></text>
          <text id="back-c4" x="140" y="169" font-size="10"
            fill="#ffd580" text-anchor="middle" dominant-baseline="middle"
            font-family="Playfair Display,serif" font-style="italic"></text>
          <text id="back-c5" x="140" y="186" font-size="10"
            fill="#ffd580" text-anchor="middle" dominant-baseline="middle"
            font-family="Playfair Display,serif" font-style="italic"></text>
          <!-- closing quote mark -->
          <text id="back-close-q" x="210" y="196" font-size="28"
            fill="#ffffff" opacity=".12" text-anchor="middle" dominant-baseline="middle"
            font-family="Playfair Display,serif">"</text>
          <line x1="110" y1="206" x2="170" y2="206"
            stroke="#ffffff" stroke-opacity=".18" stroke-width=".8"/>
          <text id="back-attr" x="140" y="221" font-size="8.5"
            fill="#ffffff" opacity=".6" text-anchor="middle" dominant-baseline="middle"
            font-family="DM Sans,sans-serif">— Mahatma Gandhi</text>
          <text id="back-yr" x="140" y="235" font-size="7"
            fill="#ffffff" opacity=".28" text-anchor="middle" dominant-baseline="middle"
            font-family="DM Sans,sans-serif">1869 – 1948</text>
          <!-- category chip at bottom -->
          <text id="back-cat" x="140" y="270" font-size="6.5"
            fill="#ffffff" opacity=".35" text-anchor="middle" dominant-baseline="middle"
            font-family="DM Sans,sans-serif" font-weight="700" letter-spacing="2"></text>
        </svg>
      </div>
    </div>

    <!-- Preview scale -->
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:1.2rem 1.5rem;box-shadow:var(--shadow)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem">
        <span style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)">Preview scale</span>
        <span id="scale-val" style="font-size:.8rem;color:var(--muted)">100%</span>
      </div>
      <input type="range" id="scale-slider" min="60" max="160" value="100" oninput="onScale(this.value)">
    </div>
  </div>

  <!-- CONTROLS PANEL -->
  <div class="panel">

    <!-- Portrait image -->
    <div class="panel-section">
      <div class="panel-label">Portrait Image (Front)</div>
      <div class="img-upload-zone" onclick="document.getElementById('img-file').click()">
        📁 Upload sketch / photo
      </div>
      <input type="file" id="img-file" accept="image/*" style="display:none" onchange="onImageUpload(this)">
      <input class="img-url-input" type="text" id="img-url" placeholder="…or paste image URL"
        value=""
        oninput="onImageUrl(this.value)">
      <img id="img-preview" alt="preview">
      <div style="display:flex;align-items:center;gap:8px;margin-top:.2rem">
        <span style="font-size:.72rem;color:var(--muted)">Opacity:</span>
        <input type="range" id="img-opacity" min="20" max="100" value="92" oninput="onImgOpacity(this.value)" style="flex:1">
        <span id="img-opacity-val" style="font-size:.75rem;color:var(--muted);min-width:30px">92%</span>
      </div>
    </div>

    <!-- Quote picker -->
    <div class="panel-section">
      <div class="panel-label">Choose Quote (Back)</div>
      <input class="quote-search" type="text" id="quote-q" placeholder="Search quotes or category…" oninput="filterQuoteList()">
      <div class="quote-pick-list" id="quote-list"></div>
    </div>

    <!-- Shirt colour -->
    <div class="panel-section">
      <div class="panel-label">Shirt Colour</div>
      <div class="panel-row" id="shirt-swatches"></div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:.3rem">
        <span style="font-size:.78rem;color:var(--muted)">Custom:</span>
        <input type="color" class="color-input" id="shirt-custom" value="#b5711d" oninput="setShirtColor(this.value)">
      </div>
    </div>

    <!-- Text colour -->
    <div class="panel-section">
      <div class="panel-label">Text Colour</div>
      <div class="panel-row" id="text-swatches"></div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:.3rem">
        <span style="font-size:.78rem;color:var(--muted)">Custom:</span>
        <input type="color" class="color-input" id="text-custom" value="#ffffff" oninput="setTextColor(this.value)">
      </div>
    </div>

    <!-- Accent colour -->
    <div class="panel-section">
      <div class="panel-label">Accent Colour</div>
      <div class="panel-row" id="accent-swatches"></div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:.3rem">
        <span style="font-size:.78rem;color:var(--muted)">Custom:</span>
        <input type="color" class="color-input" id="accent-custom" value="#ffd580" oninput="setAccentColor(this.value)">
      </div>
    </div>

    <!-- Font size -->
    <div class="panel-section">
      <div class="panel-label">Quote text size</div>
      <div style="display:flex;align-items:center;gap:8px">
        <input type="range" id="font-slider" min="7" max="16" value="10" oninput="onFontSize(this.value)" style="flex:1">
        <span id="font-val" style="font-size:.8rem;color:var(--muted);min-width:28px">10</span>
      </div>
    </div>

    <!-- T-Shirt size -->
    <div class="panel-section">
      <div class="panel-label">T-Shirt Size</div>
      <div class="chip-row" id="size-chips">
        <button class="chip" onclick="setSize('XS')">XS</button>
        <button class="chip" onclick="setSize('S')">S</button>
        <button class="chip active" onclick="setSize('M')">M</button>
        <button class="chip" onclick="setSize('L')">L</button>
        <button class="chip" onclick="setSize('XL')">XL</button>
        <button class="chip" onclick="setSize('2XL')">2XL</button>
      </div>
      <div id="size-info" style="background:#f7f3eb;border:1px solid var(--border);border-radius:12px;padding:.9rem 1rem;font-size:.78rem;line-height:1.65;color:var(--muted);margin-top:.2rem">
        <div id="size-title" style="font-weight:700;color:var(--text);font-size:.88rem;margin-bottom:.35rem"></div>
        <div id="size-dims" style="display:grid;grid-template-columns:1fr 1fr;gap:4px 12px"></div>
        <div id="size-note" style="margin-top:.5rem;font-style:italic;font-size:.72rem;color:var(--muted)"></div>
      </div>
    </div>

    <!-- Download -->
    <div style="display:flex;flex-direction:column;gap:.5rem">
      <button class="btn btn-accent" onclick="downloadPNG('front')" style="width:100%">⬇ Download Front PNG</button>
      <button class="btn btn-accent" onclick="downloadPNG('back')" style="width:100%">⬇ Download Back PNG</button>
      <button class="btn" onclick="downloadBothPNG()" style="width:100%">⬇ Download Both (combined)</button>
    </div>

  </div>
</div>

let currentQuote = QUOTES[0];
let shirtColor   = '#b5711d';
let textColor    = '#ffffff';
let accentColor  = '#ffd580';
let fontSize     = 10;

function wrapText(text, maxChars, maxLines) {
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (test.length <= maxChars) { cur = test; }
    else { if (cur) lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  return lines.slice(0, maxLines);
}

function setText(id, val) { const el = document.getElementById(id); if (el) el.textContent = val; }
function setAttr(id, attr, val) { const el = document.getElementById(id); if (el) el.setAttribute(attr, val); }

function renderShirt() {
  const q = currentQuote;
  const backLines = wrapText(q.text, 26, 5);

  setText('back-c1', backLines[0] || '');
  setText('back-c2', backLines[1] || '');
  setText('back-c3', backLines[2] || '');
  setText('back-c4', backLines[3] || '');
  setText('back-c5', backLines[4] || '');
  setText('back-cat', q.category.toUpperCase());
  setText('front-cat', 'MAHATMA GANDHI');

  ['back-c1','back-c2','back-c3','back-c4','back-c5'].forEach(id => setAttr(id, 'font-size', fontSize));
  ['body-front','body-back'].forEach(id => setAttr(id, 'fill', shirtColor));
  ['back-c1','back-c2','back-c3','back-c4','back-c5'].forEach(id => setAttr(id, 'fill', accentColor));
  ['back-attr','back-yr','back-title','back-cat','front-cat','front-year'].forEach(id => setAttr(id, 'fill', textColor));
}

function setShirtColor(c) {
  shirtColor = c;
  document.getElementById('shirt-custom').value = c;
  document.querySelectorAll('#shirt-swatches .swatch').forEach(s => s.classList.toggle('active', s.dataset.hex === c));
  renderShirt();
}
function setTextColor(c) {
  textColor = c;
  document.getElementById('text-custom').value = c;
  document.querySelectorAll('#text-swatches .swatch').forEach(s => s.classList.toggle('active', s.dataset.hex === c));
  renderShirt();
}
function setAccentColor(c) {
  accentColor = c;
  document.getElementById('accent-custom').value = c;
  document.querySelectorAll('#accent-swatches .swatch').forEach(s => s.classList.toggle('active', s.dataset.hex === c));
  renderShirt();
}
function onFontSize(v) {
  fontSize = +v;
  document.getElementById('font-val').textContent = v;
  renderShirt();
}
function onScale(v) {
  document.getElementById('scale-val').textContent = v + '%';
  const wrap = document.getElementById('shirts-wrap');
  wrap.style.transform = `scale(${v / 100})`;
  wrap.style.transformOrigin = 'top center';
}
function setSize(sz) {
  document.querySelectorAll('#size-chips .chip').forEach(c => c.classList.toggle('active', c.textContent === sz));
  const s = SIZES[sz];
  document.getElementById('size-title').textContent = sz + ' — Gandhi Quote Tee';
  document.getElementById('size-dims').innerHTML =
    `<div>Chest: <strong>${s.chest}</strong></div>` +
    `<div>Length: <strong>${s.length}</strong></div>` +
    `<div>Sleeve: <strong>${s.sleeve}</strong></div>`;
  document.getElementById('size-note').textContent = s.note;
}

function setSketchHref(href) {
  const el = document.getElementById('front-sketch');
  if (el) {
    el.setAttribute('href', href);
    el.style.mixBlendMode = 'multiply';
    el.style.filter = 'contrast(1.2) brightness(0.95)';
  }
  const prev = document.getElementById('img-preview');
  prev.src = href;
  prev.style.display = 'block';
}

function onImageUrl(val) {
  if (val.trim()) setSketchHref(val.trim());
}

function onImageUpload(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('img-url').value = '';
    setSketchHref(e.target.result);
  };
  reader.readAsDataURL(file);
}

function onImgOpacity(v) {
  document.getElementById('img-opacity-val').textContent = v + '%';
  setAttr('front-sketch', 'opacity', v / 100);
}

function selectQuote(q) {
  currentQuote = q;
  document.querySelectorAll('.quote-pick-item').forEach(el =>
    el.classList.toggle('active', +el.dataset.id === q.id));
  renderShirt();
}
function randomQuote() { selectQuote(QUOTES[Math.floor(Math.random() * QUOTES.length)]); }
function filterQuoteList() {
  const q = document.getElementById('quote-q').value.toLowerCase();
  document.querySelectorAll('.quote-pick-item').forEach(el => {
    el.style.display = (el.dataset.text.toLowerCase().includes(q) || el.dataset.cat.toLowerCase().includes(q)) ? '' : 'none';
  });
}

function buildSwatches(containerId, colors, setter, activeHex) {
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = '';
  colors.forEach(c => {
    const s = document.createElement('div');
    s.className = 'swatch' + (c.hex === activeHex ? ' active' : '');
    s.style.background = c.hex;
    s.dataset.hex = c.hex;
    s.title = c.label;
    if (['#ffffff','#f5f5f0'].includes(c.hex)) s.style.border = '2px solid #ccc';
    s.onclick = () => setter(c.hex);
    wrap.appendChild(s);
  });
}

function buildQuoteList() {
  const list = document.getElementById('quote-list');
  list.innerHTML = '';
  QUOTES.forEach(q => {
    const el = document.createElement('div');
    el.className = 'quote-pick-item' + (q.id === currentQuote.id ? ' active' : '');
    el.dataset.id   = q.id;
    el.dataset.text = q.text;
    el.dataset.cat  = q.category;
    const preview = q.text.length > 68 ? q.text.slice(0, 65) + '…' : q.text;
    el.innerHTML = `<div class="cat">${q.category}</div><div class="qt">"${preview}"</div>`;
    el.onclick = () => selectQuote(q);
    list.appendChild(el);
  });
}

// ── Canvas-based download renderer ─────────────────────────────
const SHIRT_PATH_D = [
  [60,40],[20,90],[55,110],[50,290],[230,290],[225,110],[260,90],[220,40]
];
// Draws the shirt silhouette as a canvas Path2D
function shirtPath(ctx, S) {
  const p = new Path2D();
  // main body points (scaled by S)
  p.moveTo(60*S, 40*S);
  p.lineTo(20*S, 90*S);
  p.lineTo(55*S, 110*S);
  p.lineTo(50*S, 290*S);
  p.lineTo(230*S, 290*S);
  p.lineTo(225*S, 110*S);
  p.lineTo(260*S, 90*S);
  p.lineTo(220*S, 40*S);
  // collar beziers
  p.quadraticCurveTo(195*S, 28*S, 175*S, 30*S);
  p.quadraticCurveTo(165*S, 55*S, 140*S, 60*S);
  p.quadraticCurveTo(115*S, 55*S, 105*S, 30*S);
  p.quadraticCurveTo(85*S,  28*S,  60*S, 40*S);
  p.closePath();
  return p;
}

function getSketchImg() {
  return new Promise(res => {
    const prev = document.getElementById('img-preview');
    if (!prev || !prev.src) { res(null); return; }
    if (prev.complete && prev.naturalWidth > 0) { res(prev); return; }
    prev.onload  = () => res(prev);
    prev.onerror = () => res(null);
  });
}

function wrapTextCanvas(ctx, text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width <= maxWidth) { cur = test; }
    else { if (cur) lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  return lines;
}

async function renderToCanvas(side, S) {
  const W = 280 * S, H = 320 * S;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const path = shirtPath(ctx, S);

  // 1. shirt base colour
  ctx.fillStyle = shirtColor;
  ctx.fill(path);

  // 2. subtle shirt stroke
  ctx.save();
  ctx.strokeStyle = 'rgba(0,0,0,0.1)';
  ctx.lineWidth = S;
  ctx.stroke(path);
  ctx.restore();

  if (side === 'front') {
    // 3. get sketch image (reuse already-loaded preview element)
    const img = await getSketchImg();
    if (img) {
      ctx.save();
      ctx.clip(path);                          // clip to shirt shape
      ctx.globalCompositeOperation = 'multiply';
      const opacity = parseFloat(document.getElementById('front-sketch').getAttribute('opacity') || 1);
      ctx.globalAlpha = opacity;
      // fit image: xMidYMid meet inside [55,52,170,228] scaled
      const ix = 55*S, iy = 52*S, iw = 170*S, ih = 228*S;
      const scale = Math.min(iw/img.naturalWidth, ih/img.naturalHeight);
      const dw = img.naturalWidth * scale, dh = img.naturalHeight * scale;
      const dx = ix + (iw - dw) / 2, dy = iy + (ih - dh) / 2;
      ctx.drawImage(img, dx, dy, dw, dh);
      ctx.restore();
    }

    // 4. bottom gradient overlay
    ctx.save();
    ctx.clip(path);
    const grad = ctx.createLinearGradient(0, 235*S, 0, 295*S);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.6)');
    ctx.fillStyle = grad;
    ctx.fillRect(20*S, 235*S, 240*S, 60*S);
    ctx.restore();

    // 5. text labels
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = textColor;
    ctx.globalAlpha = 0.85;
    ctx.font = `700 ${7*S}px "DM Sans", sans-serif`;
    ctx.letterSpacing = 2.5 * S + 'px';
    ctx.fillText('MAHATMA GANDHI', 140*S, 270*S);
    ctx.globalAlpha = 0.5;
    ctx.font = `${6.5*S}px "DM Sans", sans-serif`;
    ctx.letterSpacing = S + 'px';
    ctx.fillText('1869 – 1948', 140*S, 283*S);
    ctx.restore();

  } else {
    // back side ───────────────────────────────────────────────

    // 6. giant watermark M
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,0.04)';
    ctx.font = `700 ${130*S}px "Playfair Display", serif`;
    ctx.fillText('M', 140*S, 180*S);
    ctx.restore();

    // 7. header label
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = textColor;
    ctx.globalAlpha = 0.32;
    ctx.font = `700 ${6.5*S}px "DM Sans", sans-serif`;
    ctx.letterSpacing = 2.5 * S + 'px';
    ctx.fillText('MAHATMA GANDHI', 140*S, 88*S);
    ctx.restore();

    // 8. quote lines
    const q = currentQuote;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = accentColor;
    ctx.globalAlpha = 1;
    ctx.font = `italic ${fontSize*S}px "Playfair Display", serif`;
    const maxW = 165 * S;
    const lines = wrapTextCanvas(ctx, q.text, maxW).slice(0, 5);
    const lineH = (fontSize + 3) * S;
    const startY = 118 * S;
    lines.forEach((ln, i) => ctx.fillText(ln, 140*S, startY + i * lineH));
    ctx.restore();

    // 9. divider line
    const divY = (118 + lines.length * (fontSize + 3) + 6) * S;
    ctx.save();
    ctx.strokeStyle = textColor;
    ctx.globalAlpha = 0.18;
    ctx.lineWidth = 0.8 * S;
    ctx.beginPath();
    ctx.moveTo(110*S, divY); ctx.lineTo(170*S, divY);
    ctx.stroke();
    ctx.restore();

    // 10. attribution
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = textColor;
    ctx.globalAlpha = 0.6;
    ctx.font = `${8.5*S}px "DM Sans", sans-serif`;
    ctx.fillText('— Mahatma Gandhi', 140*S, divY + 16*S);
    ctx.globalAlpha = 0.28;
    ctx.font = `${7*S}px "DM Sans", sans-serif`;
    ctx.fillText('1869 – 1948', 140*S, divY + 30*S);
    ctx.globalAlpha = 0.35;
    ctx.font = `700 ${6.5*S}px "DM Sans", sans-serif`;
    ctx.fillText(q.category.toUpperCase(), 140*S, 270*S);
    ctx.restore();
  }

  // 11. collar line
  ctx.save();
  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx.lineWidth = 2 * S;
  ctx.beginPath();
  ctx.moveTo(105*S, 30*S);
  ctx.quadraticCurveTo(115*S, 55*S, 140*S, 60*S);
  ctx.quadraticCurveTo(165*S, 55*S, 175*S, 30*S);
  ctx.stroke();
  ctx.restore();

  return canvas;
}

async function downloadPNG(side) {
  const S = 3; // 3× = ~840×960 px — print quality
  const canvas = await renderToCanvas(side, S);
  const a = document.createElement('a');
  a.download = `gandhi-tshirt-${side}.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
}

async function downloadBothPNG() {
  const S = 3;
  const front = await renderToCanvas('front', S);
  const back  = await renderToCanvas('back',  S);
  const combined = document.createElement('canvas');
  combined.width  = front.width * 2 + 40 * S;
  combined.height = front.height;
  const ctx = combined.getContext('2d');
  ctx.fillStyle = '#f9f5ed';
  ctx.fillRect(0, 0, combined.width, combined.height);
  ctx.drawImage(front, 0, 0);
  ctx.drawImage(back, front.width + 40 * S, 0);
  const a = document.createElement('a');
  a.download = 'gandhi-tshirt-both.png';
  a.href = combined.toDataURL('image/png');
  a.click();
}
