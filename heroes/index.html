<style>
  /* Layout: a staff-lined title over three catalogue sections (title column left, name list right); each name opens a profile panel that slides in from the right. */
  :root {
    --bg: #EEF0F6;
    --surface: #F8F9FC;
    --fg: #0F1320;
    --muted: #555C72;
    --rule: #C8CDDC;
    --staff: #9BA3BC;
    --accent: #2F44D1;
    --accent-fg: #FFFFFF;
    --tint: #E1E5FA;
    --scrim: rgba(15, 19, 32, 0.42);
    --shadow: -24px 0 60px rgba(15, 19, 32, 0.18);

    --display: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
    --body: 'Newsreader', Georgia, 'Times New Roman', serif;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0C0F18;
      --surface: #121626;
      --fg: #E8EBF5;
      --muted: #9AA1B8;
      --rule: #2A3044;
      --staff: #3A4263;
      --accent: #8EA0FF;
      --accent-fg: #0C0F18;
      --tint: #1B2140;
      --scrim: rgba(3, 5, 10, 0.62);
      --shadow: -24px 0 60px rgba(0, 0, 0, 0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0C0F18;
    --surface: #121626;
    --fg: #E8EBF5;
    --muted: #9AA1B8;
    --rule: #2A3044;
    --staff: #3A4263;
    --accent: #8EA0FF;
    --accent-fg: #0C0F18;
    --tint: #1B2140;
    --scrim: rgba(3, 5, 10, 0.62);
    --shadow: -24px 0 60px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }

  /* Named palettes. Each one is a complete look of its own and overrides Auto (light/dark). */
  :root[data-palette="terminal"] {
    --bg: #07100B; --surface: #0B1810; --fg: #CFE8D5; --muted: #7FA38B; --rule: #1B3326; --staff: #2C5440;
    --accent: #5CE08A; --accent-fg: #07100B; --tint: #0E2017;
    --scrim: rgba(2, 6, 4, 0.7); --shadow: -24px 0 60px rgba(0, 0, 0, 0.6);
    --display: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --body: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  :root[data-palette="terminal"] body { font-size: 15px; line-height: 1.65; }
  :root[data-palette="terminal"] .intro p,
  :root[data-palette="terminal"] .role { font-style: normal; }
  :root[data-palette="terminal"] .intro p { font-size: clamp(1.05rem, 2.2vw, 1.3rem); }
  :root[data-palette="manuscript"] {
    --bg: #E9DFC8; --surface: #F2EAD7; --fg: #2A2118; --muted: #6B5D49; --rule: #CDBF9F; --staff: #A8966F;
    --accent: #8C2F23; --accent-fg: #F7EFDD; --tint: #E1D4B6;
    --scrim: rgba(42, 33, 24, 0.5); --shadow: -24px 0 60px rgba(42, 33, 24, 0.22);
    color-scheme: light;
  }
  :root[data-palette="blueprint"] {
    --bg: #0F2A4A; --surface: #133458; --fg: #E6F0FF; --muted: #9DB8DA; --rule: #2A4D78; --staff: #3C6597;
    --accent: #7FD1FF; --accent-fg: #0F2A4A; --tint: #17406B;
    --scrim: rgba(4, 14, 28, 0.66); --shadow: -24px 0 60px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
  :root[data-palette="blueprint"] body {
    background-image:
      linear-gradient(rgba(127, 209, 255, 0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(127, 209, 255, 0.07) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  :root[data-palette="ink"] {
    --bg: #FFFFFF; --surface: #FFFFFF; --fg: #000000; --muted: #404040; --rule: #BDBDBD; --staff: #757575;
    --accent: #C8102E; --accent-fg: #FFFFFF; --tint: #F0F0F0;
    --scrim: rgba(0, 0, 0, 0.5); --shadow: -24px 0 60px rgba(0, 0, 0, 0.2);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.55;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: clamp(28px, 6vw, 72px);
  }
  body.lock { overflow: hidden; }
  .wrap { max-width: 1120px; margin-inline: auto; }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .label {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* Theme picker */
  .themebar { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px 14px; margin-bottom: clamp(16px, 3vw, 32px); }
  .themes { display: flex; gap: 10px; }
  .sw {
    width: 30px; height: 30px; padding: 0;
    border-radius: 50%;
    border: 1px solid var(--staff);
    cursor: pointer;
    transition: transform 0.2s;
  }
  .sw:hover { transform: scale(1.1); }
  .sw[aria-checked="true"] { outline: 2px solid var(--accent); outline-offset: 3px; }
  #theme-name { min-width: 7ch; }

  /* Hero */
  .title {
    position: relative;
    margin: 0;
    padding: 0 0.14em 0 0.24em;
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(4.2rem, 17vw, 12rem);
    line-height: 1.08;
    letter-spacing: -0.02em;
    width: fit-content;
    max-width: 100%;
  }
  .title::before, .title::after {
    content: "";
    position: absolute;
    top: calc(50% - 0.44em);
    height: calc(0.88em + 1px);
    pointer-events: none;
  }
  .title::before {
    left: 0;
    right: 0;
    border-left: 1px solid var(--staff);
    background: repeating-linear-gradient(to bottom, var(--staff) 0, var(--staff) 1px, transparent 1px, transparent 0.22em);
    transform-origin: left center;
    animation: draw 1.3s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  .title::after {
    right: 0;
    width: 0.1em;
    border-left: 1px solid var(--staff);
    background: linear-gradient(var(--staff), var(--staff)) right / 0.045em 100% no-repeat;
  }
  .title span { position: relative; z-index: 1; }
  @keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  .intro {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 28px 48px;
    margin-top: 32px;
  }
  .intro p {
    margin: 0;
    max-width: 32ch;
    font-size: clamp(1.25rem, 2.6vw, 1.6rem);
    line-height: 1.3;
    font-style: italic;
    text-wrap: balance;
  }
  .jump { display: flex; flex-wrap: wrap; gap: 10px; min-width: 0; }
  .chip {
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 10px 14px;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: border-color 0.2s, color 0.2s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip b { font-weight: 500; color: var(--accent); margin-left: 6px; }

  /* Sections */
  main { display: block; margin-top: clamp(48px, 9vw, 112px); }
  .sec {
    display: grid;
    grid-template-columns: minmax(0, 300px) minmax(0, 1fr);
    gap: 24px clamp(24px, 5vw, 64px);
    padding-top: 28px;
    border-top: 2px solid var(--fg);
    margin-bottom: clamp(48px, 8vw, 96px);
    scroll-margin-top: 24px;
  }
  .sec-head { min-width: 0; }
  .sec-head h2 {
    margin: 12px 0 14px;
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(1.8rem, 3.4vw, 2.4rem);
    line-height: 1.1;
    text-wrap: balance;
  }
  .sec-head p { margin: 0; color: var(--muted); max-width: 34ch; }

  .roll { list-style: none; margin: 0; padding: 0; min-width: 0; border-bottom: 1px solid var(--rule); }
  .roll li { border-top: 1px solid var(--rule); }
  .roll li:first-child { border-top: 0; }
  .hero {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto 28px;
    grid-template-areas: "name years go" "known known go";
    column-gap: 20px;
    row-gap: 4px;
    align-items: baseline;
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    padding: 22px 0;
    cursor: pointer;
  }
  .hero-name {
    grid-area: name;
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(1.7rem, 3.2vw, 2.5rem);
    line-height: 1.1;
    transition: color 0.2s, transform 0.3s;
  }
  .hero-years { grid-area: years; font-family: var(--mono); font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .hero-known { grid-area: known; color: var(--muted); }
  .hero-go { grid-area: go; align-self: center; justify-self: end; color: var(--muted); transition: transform 0.3s, color 0.2s; }
  .hero:hover .hero-name { color: var(--accent); transform: translateX(6px); }
  .hero:hover .hero-go { color: var(--accent); transform: translateX(4px); }

  .foot { margin-top: 24px; max-width: 70ch; }

  /* Panel */
  .scrim {
    position: fixed; inset: 0; z-index: 20;
    background: var(--scrim);
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  .scrim.is-open { opacity: 1; pointer-events: auto; }
  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 30;
    width: min(580px, 100%);
    display: flex; flex-direction: column;
    background: var(--surface);
    color: var(--fg);
    border-left: 1px solid var(--rule);
    box-shadow: var(--shadow);
    transform: translateX(100%);
    visibility: hidden;
    transition: transform 0.42s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0s linear 0.42s;
  }
  .panel.is-open {
    transform: none;
    visibility: visible;
    transition: transform 0.42s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0s;
  }
  .panel-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 12px 24px;
    border-bottom: 1px solid var(--rule);
  }
  .counter { font-variant-numeric: tabular-nums; }
  .bar-btns { display: flex; gap: 8px; }
  .icon-btn {
    width: 40px; height: 40px;
    display: inline-grid; place-items: center;
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 2px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .panel-scroll {
    flex: 1; min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 0 max(24px, env(safe-area-inset-right, 0px)) calc(48px + env(safe-area-inset-bottom, 0px)) 24px;
  }
  .plate {
    position: relative;
    height: 168px;
    margin-top: 24px;
    display: grid; place-items: center;
    overflow: hidden;
    background-color: var(--tint);
    border: 1px solid var(--rule);
  }
  .plate.grid {
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px),
      linear-gradient(90deg, var(--rule) 1px, transparent 1px);
    background-size: 20px 20px;
  }
  .plate.hatch { background-image: repeating-linear-gradient(135deg, var(--rule) 0, var(--rule) 1px, transparent 1px, transparent 14px); }
  .plate.dots { background-image: radial-gradient(var(--staff) 1.3px, transparent 1.6px); background-size: 16px 16px; }
  .plate.staff::before {
    content: "";
    position: absolute; left: 0; right: 0; top: calc(50% - 28px); height: 57px;
    background: repeating-linear-gradient(to bottom, var(--staff) 0, var(--staff) 1px, transparent 1px, transparent 14px);
  }
  .initials {
    position: relative;
    padding: 0 0.28em;
    background: var(--tint);
    font-family: var(--display);
    font-weight: 500;
    font-size: 4.6rem;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--accent);
  }
  .panel h2 {
    margin: 22px 0 6px;
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(2.1rem, 6vw, 3rem);
    line-height: 1.05;
    text-wrap: balance;
  }
  .role { margin: 0; font-style: italic; font-size: 1.15rem; color: var(--muted); }
  .facts { margin: 24px 0 0; display: grid; grid-template-columns: 1fr; border-top: 1px solid var(--rule); }
  .facts div { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
  .facts dt { margin: 0; }
  .facts dd { margin: 0; }
  .panel h3 { margin: 36px 0 10px; font-weight: 400; }
  .summary p { margin: 0 0 14px; }
  .list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
  .list li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 16px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .list li > span:first-child { min-width: 0; }
  .tag { font-family: var(--mono); font-size: 12px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .time { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
  .time li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .time .tag { padding-top: 3px; }
  .wiki {
    display: inline-flex; align-items: center; gap: 10px;
    margin-top: 32px;
    padding: 12px 16px;
    border: 1px solid var(--accent);
    border-radius: 2px;
    color: var(--accent);
    text-decoration: none;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: background 0.2s, color 0.2s;
  }
  .wiki:hover { background: var(--accent); color: var(--accent-fg); }
  .src { margin: 14px 0 0; color: var(--muted); font-size: 0.9rem; }

  @media (max-width: 760px) {
    .sec { grid-template-columns: minmax(0, 1fr); }
    .hero { padding: 18px 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: 0s !important; transition-delay: 0s !important; }
  }
</style>

    b.style.background = "linear-gradient(135deg, " + p.sw[0] + " 0 50%, " + p.sw[1] + " 50% 100%)";
    b.addEventListener("click", function () { applyPalette(p.id, true); });
    b.addEventListener("keydown", function (e) {
      var d = e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : e.key === "ArrowLeft" || e.key === "ArrowUp" ? -1 : 0;
      if (!d) return;
      e.preventDefault();
      var n = (i + d + PALETTES.length) % PALETTES.length;
      applyPalette(PALETTES[n].id, true);
      swatches[n].focus();
    });
    themesEl.appendChild(b);
    swatches.push(b);
  });
  var saved = "auto";
  try { saved = localStorage.getItem("heroes-palette") || "auto"; } catch (e) {}
  applyPalette(saved, false);

  function fromHash() {
    var id = "";
    try { id = location.hash.slice(1); } catch (e) {}
    if (byId[id]) show(id); else hide();
  }
  window.addEventListener("hashchange", fromHash);
  fromHash();
})();
</script>
