<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Recorder — Speech to Text</title>
<style>
  :root {
    --bg:      #0f1117;
    --bg2:     #1a1d27;
    --bg3:     #23263a;
    --border:  #2e3250;
    --accent:  #6c8aff;
    --accent2: #a78bfa;
    --text:    #e2e8f0;
    --muted:   #7c85a2;
    --red:     #f87171;
    --green:   #34d399;
    --pulse:   #ef4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 60px;
  }

  header {
    text-align: center;
    margin-bottom: 36px;
  }

  header h1 {
    font-size: 1.7rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }

  header p {
    color: var(--muted);
    font-size: 0.88rem;
  }

  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    width: 100%;
    max-width: 680px;
  }

  /* ── Language selector ── */
  .lang-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .lang-row label {
    font-size: 0.82rem;
    color: var(--muted);
    white-space: nowrap;
  }

  select#langSelect {
    flex: 1;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 0.88rem;
    outline: none;
    cursor: pointer;
    transition: border-color .2s;
  }

  select#langSelect:focus { border-color: var(--accent); }

  /* ── Mic button ── */
  .mic-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }

  #micBtn {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: var(--bg3);
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .2s, border-color .2s, transform .1s;
    position: relative;
  }

  #micBtn:hover { background: var(--border); }
  #micBtn:active { transform: scale(.95); }

  #micBtn.recording {
    background: #3d1515;
    border-color: var(--pulse);
    animation: pulse 1.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,.4); }
    50%       { box-shadow: 0 0 0 14px rgba(239,68,68,0); }
  }

  #micBtn svg { pointer-events: none; }

  #statusText {
    font-size: 0.82rem;
    color: var(--muted);
    height: 18px;
  }

  #statusText.active { color: var(--red); }
  #statusText.ok     { color: var(--green); }

  /* ── Interim transcript ── */
  #interim {
    min-height: 32px;
    padding: 8px 12px;
    background: var(--bg3);
    border: 1px dashed var(--border);
    border-radius: 8px;
    font-size: 0.85rem;
    color: var(--muted);
    font-style: italic;
    margin-bottom: 16px;
    transition: opacity .2s;
  }

  /* ── Output textarea ── */
  .textarea-label {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 6px;
  }

  #output {
    width: 100%;
    min-height: 200px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 0.95rem;
    line-height: 1.65;
    padding: 14px;
    resize: vertical;
    outline: none;
    font-family: inherit;
    transition: border-color .2s;
  }

  #output:focus { border-color: var(--accent); }

  /* ── Actions ── */
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  .btn {
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg3);
    color: var(--text);
    font-size: 0.83rem;
    cursor: pointer;
    transition: background .15s, border-color .15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn:hover { background: var(--border); border-color: var(--accent); }

  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .btn.primary:hover { background: #5a78f0; }

  #copyBtn.copied { color: var(--green); border-color: var(--green); }

  /* ── Word / char count ── */
  .stats {
    margin-top: 8px;
    font-size: 0.75rem;
    color: var(--muted);
    text-align: right;
  }

  /* ── Not-supported banner ── */
  #notSupported {
    display: none;
    background: #3d1515;
    border: 1px solid var(--red);
    border-radius: 10px;
    padding: 14px 18px;
    color: var(--red);
    font-size: 0.87rem;
    margin-bottom: 20px;
  }
</style>
</head>
<body>

<header>
  <h1>🎙 Voice to Text</h1>
  <p>Select a language, press the mic, and start speaking</p>
</header>

<div id="notSupported">
  Speech recognition is not supported in this browser. Please use Chrome or Edge.
</div>

<div class="card">

  <!-- Language -->
  <div class="lang-row">
    <label for="langSelect">Language</label>
    <select id="langSelect">
      <option value="en-US">English (US)</option>
      <option value="en-GB">English (UK)</option>
      <option value="es-ES">Spanish</option>
      <option value="fr-FR">French</option>
      <option value="de-DE">German</option>
      <option value="it-IT">Italian</option>
      <option value="pt-BR">Portuguese (BR)</option>
      <option value="ja-JP">Japanese</option>
      <option value="zh-CN">Chinese (Mandarin)</option>
      <option value="ko-KR">Korean</option>
      <option value="ar-SA">Arabic</option>
      <option value="hi-IN">Hindi</option>
      <option value="ta-IN">Tamil</option>
      <option value="te-IN">Telugu</option>
      <option value="ml-IN">Malayalam</option>
      <option value="ru-RU">Russian</option>
      <option value="nl-NL">Dutch</option>
      <option value="pl-PL">Polish</option>
      <option value="tr-TR">Turkish</option>
      <option value="vi-VN">Vietnamese</option>
      <option value="th-TH">Thai</option>
      <option value="id-ID">Indonesian</option>
    </select>
  </div>

  <!-- Mic -->
  <div class="mic-area">
    <button id="micBtn" title="Click to start / stop recording" aria-label="Toggle recording">
      <!-- mic icon -->
      <svg id="micIcon" width="34" height="34" viewBox="0 0 24 24" fill="none"
           stroke="#6c8aff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8"  y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <span id="statusText">Click the mic to start</span>
  </div>

  <!-- Interim (live) -->
  <div id="interim">Spoken words will appear here while recording…</div>

  <!-- Final text -->
  <div class="textarea-label">Transcribed text — you can edit freely</div>
  <textarea id="output" placeholder="Your transcribed text will appear here…" spellcheck="true"></textarea>
  <div class="stats" id="stats">0 words · 0 chars</div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn primary" id="micBtn2" title="Start / stop recording">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      </svg>
      Start Recording
    </button>
    <button class="btn" id="copyBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
      Copy
    </button>
    <button class="btn" id="downloadBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Download
    </button>
    <button class="btn" id="clearBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
        <path d="M10 11v6"/><path d="M14 11v6"/>
        <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
      </svg>
      Clear
    </button>
  </div>

</div>

<script>
(function () {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    document.getElementById('notSupported').style.display = 'block';
    document.getElementById('micBtn').disabled = true;
    document.getElementById('micBtn2').disabled = true;
    return;
  }

  let recognition = null;
  let isRecording = false;
  let finalText = '';

  const langSelect   = document.getElementById('langSelect');
  const micBtn       = document.getElementById('micBtn');
  const micBtn2      = document.getElementById('micBtn2');
  const statusText   = document.getElementById('statusText');
  const interimDiv   = document.getElementById('interim');
  const output       = document.getElementById('output');
  const stats        = document.getElementById('stats');
  const copyBtn      = document.getElementById('copyBtn');
  const downloadBtn  = document.getElementById('downloadBtn');
  const clearBtn     = document.getElementById('clearBtn');

  function buildRecognition() {
    if (recognition) {
      recognition.onresult = null;
      recognition.onend = null;
      recognition.onerror = null;
      try { recognition.abort(); } catch (_) {}
    }

    recognition = new SpeechRecognition();
    recognition.lang = langSelect.value;
    recognition.interimResults = true;
    recognition.continuous = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      isRecording = true;
      micBtn.classList.add('recording');
      statusText.textContent = 'Recording…';
      statusText.className = 'active';
      micBtn2.textContent = '';
      micBtn2.insertAdjacentHTML('afterbegin', `
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="6" width="12" height="12" rx="2"/>
        </svg> Stop Recording`);
    };

    recognition.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) {
          finalText += t + ' ';
          output.value = finalText.trimEnd();
          updateStats();
        } else {
          interim += t;
        }
      }
      interimDiv.textContent = interim || '…';
    };

    recognition.onerror = (e) => {
      if (e.error === 'no-speech') return;
      statusText.textContent = 'Error: ' + e.error;
      statusText.className = '';
      stopRecording();
    };

    recognition.onend = () => {
      if (isRecording) {
        recognition.start();
      } else {
        setIdleState();
      }
    };
  }

  function setIdleState() {
    isRecording = false;
    micBtn.classList.remove('recording');
    statusText.textContent = 'Click the mic to start';
    statusText.className = '';
    interimDiv.textContent = 'Spoken words will appear here while recording…';
    micBtn2.innerHTML = `
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      </svg> Start Recording`;
  }

  function stopRecording() {
    isRecording = false;
    try { recognition.stop(); } catch (_) {}
  }

  function toggleRecording() {
    if (isRecording) {
      stopRecording();
    } else {
      finalText = output.value ? output.value.trimEnd() + ' ' : '';
      buildRecognition();
      recognition.start();
    }
  }

  function updateStats() {
    const text = output.value.trim();
    const words = text ? text.split(/\s+/).length : 0;
    stats.textContent = `${words} word${words !== 1 ? 's' : ''} · ${text.length} chars`;
  }

  micBtn.addEventListener('click', toggleRecording);
  micBtn2.addEventListener('click', toggleRecording);

  output.addEventListener('input', () => {
    finalText = output.value;
    updateStats();
  });

  langSelect.addEventListener('change', () => {
    if (isRecording) {
      stopRecording();
      setTimeout(() => {
        finalText = output.value ? output.value.trimEnd() + ' ' : '';
        buildRecognition();
        recognition.start();
      }, 300);
    }
  });

  copyBtn.addEventListener('click', () => {
    if (!output.value) return;
    navigator.clipboard.writeText(output.value).then(() => {
      copyBtn.classList.add('copied');
      copyBtn.innerHTML = `
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg> Copied!`;
      setTimeout(() => {
        copyBtn.classList.remove('copied');
        copyBtn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg> Copy`;
      }, 2000);
    });
  });

  downloadBtn.addEventListener('click', () => {
    if (!output.value) return;
    const blob = new Blob([output.value], { type: 'text/plain' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = 'transcript.txt';
    a.click();
    URL.revokeObjectURL(url);
  });

  clearBtn.addEventListener('click', () => {
    if (isRecording) stopRecording();
    finalText = '';
    output.value = '';
    updateStats();
    interimDiv.textContent = 'Spoken words will appear here while recording…';
    statusText.textContent = 'Click the mic to start';
    statusText.className = '';
  });

})();
</script>
</body>
</html>
