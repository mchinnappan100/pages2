<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thirukkural T-Shirt Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,700;1,300&family=DM+Sans:wght@300;400;600;700&family=Noto+Serif+Tamil:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="icon" href="https://mohan-chinnappan-n5.github.io/dfv/img/mc_favIcon.ico" />
<link rel="stylesheet" href="app-ts.css">
</head>
<body>

<nav>
  <div class="nav-brand">
    <div class="brand-dot">க</div>
    <span>Thirukkural <em style="font-weight:300;font-style:italic;">T-Shirt Designer</em></span>
  </div>
  <div style="display:flex;gap:8px">
    <a href="thirukkural.html" class="btn">📖 Thirukkural</a>
    <button class="btn" onclick="randomKural()">🎲 Random Kural</button>
    <button class="btn btn-accent" onclick="downloadPNG('front')">⬇ Front PNG</button>
    <button class="btn btn-accent" onclick="downloadPNG('back')">⬇ Back PNG</button>
  </div>
</nav>

<div class="designer">

  <!-- CANVAS -->
  <div style="display:flex;flex-direction:column;gap:1.2rem">
    <div class="canvas-wrap" id="shirts-wrap">
      <!-- Front -->
      <div class="shirt-frame">
        <div class="shirt-label">Front</div>
        <svg id="svg-front" class="shirt-svg" width="280" height="320" viewBox="0 0 280 320" xmlns="http://www.w3.org/2000/svg">
          <!-- shirt silhouette -->
          <path class="shirt-body" id="body-front"
            d="M60,40 L20,90 L55,110 L50,290 L230,290 L225,110 L260,90 L220,40
               Q195,28 175,30 Q165,55 140,60 Q115,55 105,30 Q85,28 60,40Z"
            fill="#2d5f8a" stroke="rgba(0,0,0,.1)" stroke-width="1"/>
          <!-- collar shading -->
          <path class="shirt-collar" id="collar-front"
            d="M105,30 Q115,55 140,60 Q165,55 175,30"
            fill="none" stroke="rgba(0,0,0,.12)" stroke-width="2"/>
          <!-- content — front: only the 2 Tamil kural lines + subtle glyph -->
          <text class="shirt-logo" id="front-logo" x="140" y="118" font-size="36" fill="#ffffff" opacity=".08">க</text>
          <text class="shirt-text-line" id="front-l1" x="140" y="172" font-size="11" fill="#ffffff" font-weight="700" textLength="160" lengthAdjust="spacingAndGlyphs"></text>
          <text class="shirt-text-line" id="front-l2" x="140" y="198" font-size="11" fill="#ffffff" font-weight="700" textLength="160" lengthAdjust="spacingAndGlyphs"></text>
          <line class="shirt-divider" id="front-div" x1="110" y1="214" x2="170" y2="214" stroke="#ffffff" stroke-opacity=".2" stroke-width=".8"/>
          <text class="shirt-text-no" id="front-no" x="140" y="228" font-size="9" fill="#ffffff" opacity=".45"></text>
        </svg>
      </div>

      <!-- Back -->
      <div class="shirt-frame">
        <div class="shirt-label">Back</div>
        <svg id="svg-back" class="shirt-svg" width="280" height="320" viewBox="0 0 280 320" xmlns="http://www.w3.org/2000/svg">
          <path class="shirt-body" id="body-back"
            d="M60,40 L20,90 L55,110 L50,290 L230,290 L225,110 L260,90 L220,40
               Q195,28 175,30 Q165,55 140,60 Q115,55 105,30 Q85,28 60,40Z"
            fill="#2d5f8a" stroke="rgba(0,0,0,.1)" stroke-width="1"/>
          <path class="shirt-collar" fill="none" stroke="rgba(0,0,0,.12)" stroke-width="2"
            d="M105,30 Q115,55 140,60 Q165,55 175,30"/>
          <!-- back content: English translation + attribution only -->
          <text class="shirt-text-en" id="back-title" x="140" y="95" font-size="7.5" fill="#ffffff" opacity=".4" letter-spacing="2.5" text-anchor="middle" font-style="normal" font-weight="700">THIRUKKURAL</text>
          <text class="shirt-text-en" id="back-c1" x="140" y="132" font-size="11" fill="#ffd580"></text>
          <text class="shirt-text-en" id="back-c2" x="140" y="149" font-size="11" fill="#ffd580"></text>
          <text class="shirt-text-en" id="back-c3" x="140" y="166" font-size="11" fill="#ffd580"></text>
          <text class="shirt-text-en" id="back-c4" x="140" y="183" font-size="11" fill="#ffd580"></text>
          <line class="shirt-divider" x1="110" y1="200" x2="170" y2="200" stroke="#ffffff" stroke-opacity=".18" stroke-width=".8"/>
          <text class="shirt-text-en" id="back-attr" x="140" y="218" font-size="8" fill="#ffffff" opacity=".5" font-style="normal">— Thiruvalluvar</text>
          <text class="shirt-text-en" id="back-no"   x="140" y="233" font-size="7.5" fill="#ffffff" opacity=".28" font-style="normal"></text>
        </svg>
      </div>
    </div>

    <!-- size slider -->
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:1.2rem 1.5rem;box-shadow:var(--shadow)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem">
        <span style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)">Preview scale</span>
        <span id="scale-val" style="font-size:.8rem;color:var(--muted)">100%</span>
      </div>
      <input type="range" id="scale-slider" min="60" max="160" value="100" oninput="onScale(this.value)">
    </div>
  </div>

  <!-- CONTROLS PANEL -->
  <div class="panel">

    <!-- Kural picker -->
    <div class="panel-section">
      <div class="panel-label">Choose Kural</div>
      <input class="kural-search" type="text" id="kural-q" placeholder="Search Tamil / English / №…" oninput="filterKuralList()">
      <div class="kural-pick-list" id="kural-list"></div>
    </div>

    <!-- Shirt colour -->
    <div class="panel-section">
      <div class="panel-label">Shirt Colour</div>
      <div class="panel-row" id="shirt-swatches"></div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:.3rem">
        <span style="font-size:.78rem;color:var(--muted)">Custom:</span>
        <input type="color" class="color-input" id="shirt-custom" value="#2d5f8a" oninput="setShirtColor(this.value)">
      </div>
    </div>

    <!-- Text colour -->
    <div class="panel-section">
      <div class="panel-label">Text Colour</div>
      <div class="panel-row" id="text-swatches"></div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:.3rem">
        <span style="font-size:.78rem;color:var(--muted)">Custom:</span>
        <input type="color" class="color-input" id="text-custom" value="#ffffff" oninput="setTextColor(this.value)">
      </div>
    </div>

    <!-- Accent colour (kural number / couplet) -->
    <div class="panel-section">
      <div class="panel-label">Accent Colour</div>
      <div class="panel-row" id="accent-swatches"></div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:.3rem">
        <span style="font-size:.78rem;color:var(--muted)">Custom:</span>
        <input type="color" class="color-input" id="accent-custom" value="#ffd580" oninput="setAccentColor(this.value)">
      </div>
    </div>

    <!-- Font size -->
    <div class="panel-section">
      <div class="panel-label">Tamil text size</div>
      <div style="display:flex;align-items:center;gap:8px">
        <input type="range" id="font-slider" min="8" max="20" value="11" oninput="onFontSize(this.value)" style="flex:1">
        <span id="font-val" style="font-size:.8rem;color:var(--muted);min-width:28px">11</span>
      </div>
    </div>

    <!-- T-Shirt Size -->
    <div class="panel-section">
      <div class="panel-label">T-Shirt Size</div>
      <div class="chip-row" id="size-chips">
        <button class="chip" onclick="setSize('XS')">XS</button>
        <button class="chip" onclick="setSize('S')">S</button>
        <button class="chip active" onclick="setSize('M')">M</button>
        <button class="chip" onclick="setSize('L')">L</button>
        <button class="chip" onclick="setSize('XL')">XL</button>
        <button class="chip" onclick="setSize('2XL')">2XL</button>
      </div>
      <!-- size info card -->
      <div id="size-info" style="background:#f7f4ee;border:1px solid var(--border);border-radius:12px;padding:.9rem 1rem;font-size:.78rem;line-height:1.65;color:var(--muted);margin-top:.2rem;">
        <div id="size-title" style="font-weight:700;color:var(--text);font-size:.88rem;margin-bottom:.35rem;"></div>
        <div id="size-dims" style="display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;"></div>
        <div id="size-note" style="margin-top:.5rem;font-style:italic;font-size:.72rem;color:var(--muted);"></div>
      </div>
    </div>

    <!-- download -->
    <div style="display:flex;flex-direction:column;gap:.5rem">
      <button class="btn btn-accent" onclick="downloadPNG('front')" style="width:100%">⬇ Download Front PNG</button>
      <button class="btn btn-accent" onclick="downloadPNG('back')" style="width:100%">⬇ Download Back PNG</button>
      <button class="btn" onclick="downloadBothPNG()" style="width:100%">⬇ Download Both (combined)</button>
    </div>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="app-ts.min.js"></script>
</body>
</html>
