<!doctype html>
<html lang="en" class="min-h-screen">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NPM Packages</title>
  <link rel="icon" type="image/x-icon" href="https://mohan-chinnappan-n5.github.io/dfv/img/mc_favIcon.ico" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <style>
    .sortable { cursor: pointer; user-select: none; }
    .sort-indicator { width: 1rem; display: inline-block; }

    /* Skeleton shimmer */
    @keyframes shimmer {
      0%   { background-position: -800px 0; }
      100% { background-position:  800px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
      background-size: 800px 100%;
      animation: shimmer 1.4s infinite linear;
      border-radius: 4px;
    }
    .dark .skeleton {
      background: linear-gradient(90deg, #374151 25%, #4b5563 50%, #374151 75%);
      background-size: 800px 100%;
    }

    /* Toggle pill */
    .toggle-pill { position: relative; display: inline-block; width: 2.5rem; height: 1.25rem; }
    .toggle-pill input { opacity: 0; width: 0; height: 0; }
    .toggle-track {
      position: absolute; inset: 0; border-radius: 9999px;
      background: #d1d5db; transition: background .2s;
    }
    .toggle-pill input:checked + .toggle-track { background: #3b82f6; }
    .toggle-thumb {
      position: absolute; top: 2px; left: 2px;
      width: 1rem; height: 1rem; border-radius: 9999px;
      background: white; transition: transform .2s;
      box-shadow: 0 1px 3px rgba(0,0,0,.3);
    }
    .toggle-pill input:checked ~ .toggle-thumb { transform: translateX(1.25rem); }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">
  <div class="max-w-6xl mx-auto p-6">
    <header class="flex items-center justify-between gap-4">
      <div>
        <div class="flex items-center gap-3">
          <img id="publisherAvatar" src="" alt="" class="w-10 h-10 rounded-full ring-2 ring-blue-400 hidden" />
          <h1 id="title" class="text-2xl font-bold">📦 NPM Packages</h1>
        </div>
        <p class="text-sm text-gray-600 dark:text-gray-300">Search, sort, paginate, and export CSV</p>
      </div>
      <div class="flex gap-3 items-center">
        <label class="flex items-center gap-2 text-sm cursor-pointer select-none">
          <span class="toggle-pill">
            <input id="darkToggle" type="checkbox" />
            <span class="toggle-track"></span>
            <span class="toggle-thumb"></span>
          </span>
          Dark mode
        </label>
        <button id="exportCsvBtn" class="px-3 py-1 rounded bg-blue-600 text-white text-sm hover:bg-blue-500">Export CSV</button>
      </div>
    </header>

    <!-- KPI section -->
    <section class="mt-6 bg-white dark:bg-gray-800 rounded-lg shadow">
      <button id="kpiToggle" class="w-full flex items-center justify-between px-4 py-3 text-sm font-semibold text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 rounded-lg transition-colors">
        <span>📊 Stats Overview</span>
        <span id="kpiChevron" class="transition-transform duration-200">▾</span>
      </button>
      <div id="kpiPanel" class="grid grid-cols-2 md:grid-cols-4 gap-4 px-4 pb-4">
        <div class="rounded-lg bg-blue-50 dark:bg-blue-900/30 p-4 flex flex-col gap-1">
          <span class="text-xs font-medium text-blue-500 dark:text-blue-400 uppercase tracking-wide">Total Packages</span>
          <span id="kpi-total" class="text-2xl font-bold text-blue-700 dark:text-blue-300">—</span>
        </div>
        <div class="rounded-lg bg-green-50 dark:bg-green-900/30 p-4 flex flex-col gap-1">
          <span class="text-xs font-medium text-green-600 dark:text-green-400 uppercase tracking-wide">Latest Published</span>
          <span id="kpi-latest-name" class="text-sm font-semibold text-green-700 dark:text-green-300 truncate">—</span>
          <span id="kpi-latest-date" class="text-xs text-green-600 dark:text-green-400">—</span>
        </div>
        <div class="rounded-lg bg-purple-50 dark:bg-purple-900/30 p-4 flex flex-col gap-1">
          <span class="text-xs font-medium text-purple-600 dark:text-purple-400 uppercase tracking-wide">Oldest Package</span>
          <span id="kpi-oldest-name" class="text-sm font-semibold text-purple-700 dark:text-purple-300 truncate">—</span>
          <span id="kpi-oldest-date" class="text-xs text-purple-600 dark:text-purple-400">—</span>
        </div>
        <div class="rounded-lg bg-orange-50 dark:bg-orange-900/30 p-4 flex flex-col gap-1">
          <span class="text-xs font-medium text-orange-600 dark:text-orange-400 uppercase tracking-wide">Published This Year</span>
          <span id="kpi-this-year" class="text-2xl font-bold text-orange-700 dark:text-orange-300">—</span>
        </div>
      </div>
    </section>

    <section class="mt-4 bg-white dark:bg-gray-800 rounded-lg shadow p-4">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
        <div class="flex items-center gap-2">
          <input id="searchInput" type="search" placeholder="Search by name or description..." class="px-3 py-2 rounded border w-72 bg-transparent focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" />
          <select id="pageSize" class="px-2 py-1 rounded border bg-transparent text-sm">
            <option value="5">5 / page</option>
            <option value="10" selected>10 / page</option>
            <option value="25">25 / page</option>
          </select>
        </div>
        <div class="text-sm text-gray-600 dark:text-gray-300">Showing <span id="shownCount">0</span> of <strong id="totalCount">0</strong></div>
      </div>

      <div class="mt-4 overflow-x-auto">
        <table id="pkgTable" class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
          <thead class="bg-gray-100 dark:bg-gray-700 sticky top-0">
            <tr>
              <th class="px-4 py-2 text-left sortable" data-col="name">Name <span id="si-name" class="sort-indicator"></span></th>
              <th class="px-4 py-2 text-left sortable" data-col="version">Version <span id="si-version" class="sort-indicator"></span></th>
              <th class="px-4 py-2 text-left sortable" data-col="description">Description <span id="si-description" class="sort-indicator"></span></th>
              <th class="px-4 py-2 text-left sortable" data-col="date">Published <span id="si-date" class="sort-indicator"></span></th>
              <th class="px-4 py-2">Link</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">
            <!-- skeleton rows shown before data loads -->
            <tr class="skeleton-row"><td class="px-4 py-3"><div class="skeleton h-4 w-36"></div></td><td class="px-4 py-3"><div class="skeleton h-4 w-12"></div></td><td class="px-4 py-3"><div class="skeleton h-4 w-80"></div></td><td class="px-4 py-3"><div class="skeleton h-4 w-20"></div></td><td class="px-4 py-3"><div class="skeleton h-6 w-14 rounded-full"></div></td></tr>
            <tr class="skeleton-row"><td class="px-4 py-3"><div class="skeleton h-4 w-28"></div></td><td class="px-4 py-3"><div class="skeleton h-4 w-10"></div></td><td class="px-4 py-3"><div class="skeleton h-4 w-64"></div></td><td class="px-4 py-3"><div class="skeleton h-4 w-20"></div></td><td class="px-4 py-3"><div class="skeleton h-6 w-14 rounded-full"></div></td></tr>
            <tr class="skeleton-row"><td class="px-4 py-3"><div class="skeleton h-4 w-40"></div></td><td class="px-4 py-3"><div class="skeleton h-4 w-12"></div></td><td class="px-4 py-3"><div class="skeleton h-4 w-72"></div></td><td class="px-4 py-3"><div class="skeleton h-4 w-20"></div></td><td class="px-4 py-3"><div class="skeleton h-6 w-14 rounded-full"></div></td></tr>
            <tr class="skeleton-row"><td class="px-4 py-3"><div class="skeleton h-4 w-32"></div></td><td class="px-4 py-3"><div class="skeleton h-4 w-10"></div></td><td class="px-4 py-3"><div class="skeleton h-4 w-56"></div></td><td class="px-4 py-3"><div class="skeleton h-4 w-20"></div></td><td class="px-4 py-3"><div class="skeleton h-6 w-14 rounded-full"></div></td></tr>
            <tr class="skeleton-row"><td class="px-4 py-3"><div class="skeleton h-4 w-44"></div></td><td class="px-4 py-3"><div class="skeleton h-4 w-12"></div></td><td class="px-4 py-3"><div class="skeleton h-4 w-96"></div></td><td class="px-4 py-3"><div class="skeleton h-4 w-20"></div></td><td class="px-4 py-3"><div class="skeleton h-6 w-14 rounded-full"></div></td></tr>
          </tbody>
        </table>
      </div>

      <nav class="mt-4 flex items-center justify-between">
        <div>
          <button id="prevPage" class="px-3 py-1 rounded border text-sm mr-2 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-gray-100 dark:hover:bg-gray-700 transition">Prev</button>
          <button id="nextPage" class="px-3 py-1 rounded border text-sm disabled:opacity-40 disabled:cursor-not-allowed hover:bg-gray-100 dark:hover:bg-gray-700 transition">Next</button>
        </div>
        <div class="text-sm">Page <span id="currentPage">1</span> / <span id="pageCount">1</span></div>
      </nav>
    </section>
  </div>

  <script src="./app.js" ></script>

</body>
</html>
