<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notebook — Design Patterns for the AI Era</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;0,700;1,300;1,500&family=DM+Sans:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="https://mohan-chinnappan-n5.github.io/dfv/img/mc_favIcon.ico" />
<link rel="stylesheet" href="book.css">
</head>
<body>

<!-- NAV -->
<nav>
  <a class="nav-brand" href="index.html">
    <div class="brand-dot">⬡</div>
    <span>Design Patterns <span style="font-weight:300;font-style:italic;font-size:0.9em;">for the AI Era</span></span>
  </a>
  <div style="display:flex;align-items:center;gap:10px;">
    <a href="index.html#notebooks" class="theme-btn" style="text-decoration:none;">Notebooks</a>
    <a href="index.html#patterns"  class="theme-btn" style="text-decoration:none;">All Parts</a>
    <button class="theme-btn" onclick="openSettings()">⚙ Settings · <span id="settings-btn-label">Dark</span></button>
  </div>
</nav>

<!-- SETTINGS OVERLAY -->
<div id="settings-overlay" onclick="handleSettingsOverlayClick(event)">
  <div id="settings-box"></div>
</div>

<!-- NOTEBOOK VIEWER -->
<div class="nb-viewer-outer">
  <div class="nb-viewer-toolbar" id="nb-toolbar">
    <div class="nb-viewer-meta" id="nb-meta"></div>
    <a id="nb-download-btn" class="nb-btn" style="text-decoration:none;" download>⬇ Download</a>
  </div>
  <div id="nb-cells"></div>
  <div id="nb-loading" class="nb-loading">
    <div class="nb-spinner"></div>
    <div class="nb-loading-text">Loading notebook…</div>
  </div>
  <div id="nb-error" class="nb-error" style="display:none;"></div>
</div>

<script>
window.MonacoEnvironment = {
  getWorkerUrl: function (_moduleId, label) {
    const base = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs';
    let w;
    if (label === 'css' || label === 'scss' || label === 'less') w = base + '/language/css/css.worker.js';
    else if (label === 'html' || label === 'handlebars' || label === 'razor') w = base + '/language/html/html.worker.js';
    else if (label === 'json') w = base + '/language/json/json.worker.js';
    else if (label === 'typescript' || label === 'javascript') w = base + '/language/typescript/ts.worker.js';
    else w = base + '/editor/editor.worker.js';
    return URL.createObjectURL(new Blob(['importScripts("' + w + '");'], { type: 'application/javascript' }));
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
<script src="book.js"></script>
</body>
</html>
