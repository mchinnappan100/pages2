    transform:translate(-50%,-100%) rotate(0deg);
    border-radius:4px;
  }
  .hour {
    width:7%;
    height:27%;
    background:#fff;
    border:2px solid #111;
    box-shadow:0 0 0 1px rgba(0,0,0,.6), 2px 3px 8px rgba(0,0,0,.8);
  }
  .minute {
    width:4.5%;
    height:38%;
    background:#fff;
    border:2px solid #111;
    box-shadow:0 0 0 1px rgba(0,0,0,.6), 2px 3px 8px rgba(0,0,0,.8);
  }
  .second {
    width:2%;
    height:44%;
    background:#ff2200;
    border:1px solid #800;
    box-shadow:0 0 0 1px rgba(0,0,0,.5), 1px 2px 6px rgba(0,0,0,.8);
  }
  .second::after {
    content:"";
    position:absolute;
    left:50%;
    bottom:-14%;
    width:9px;
    height:9px;
    transform:translateX(-50%);
    border-radius:50%;
    background:#ff2200;
    box-shadow:0 0 0 1px #800;
  }

  .pin {
    position:absolute;
    left:50%; top:50%;
    width:16px; height:16px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#fff;
    border:3px solid #111;
    box-shadow:0 0 0 1px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.8);
    z-index:10;
  }

  .digital {
    position:absolute;
    left:50%;
    bottom:5%;
    transform:translateX(-50%);
    padding:8px 15px;
    border-radius:12px;
    background:rgba(15,22,26,.72);
    color:#fff;
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:clamp(12px,1.5vw,18px);
    letter-spacing:.08em;
    backdrop-filter:blur(5px);
    box-shadow:0 4px 14px rgba(0,0,0,.25);
  }

  .title {
    position:absolute;
    top:4%;
    left:50%;
    transform:translateX(-50%);
    padding:8px 18px;
    color:white;
    background:rgba(20,30,35,.38);
    border:1px solid rgba(255,255,255,.35);
    border-radius:999px;
    font-size:clamp(12px,1.5vw,18px);
    letter-spacing:.12em;
    text-transform:uppercase;
    backdrop-filter:blur(4px);
  }

  .tz-panel {
    position:absolute;
    padding:10px 16px;
    border-radius:14px;
    background:rgba(15,22,26,.78);
    color:#fff;
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
    backdrop-filter:blur(6px);
    box-shadow:0 4px 16px rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.15);
    text-align:center;
    min-width:140px;
  }
  .tz-panel.monaco { bottom:3%; right:3%; }
  .tz-panel.india  { bottom:3%; left:3%; }
  .tz-panel.london { top:14%; left:3%; }
  .tz-panel .mp-label {
    font-size:clamp(9px,1vw,12px);
    letter-spacing:.12em;
    text-transform:uppercase;
    color:rgba(255,255,255,.6);
    margin-bottom:4px;
  }
  .tz-panel .mp-time {
    font-size:clamp(14px,1.8vw,22px);
    letter-spacing:.06em;
  }
  .tz-panel.monaco .mp-time { color:#ffe066; }
  .tz-panel.india  .mp-time { color:#80e8a0; }
  .tz-panel.london .mp-time { color:#80cfff; }
  .tz-panel .mp-date {
    font-size:clamp(9px,1vw,12px);
    color:rgba(255,255,255,.55);
    margin-top:3px;
  }

  @media (max-width:700px) {
    .scene { background-size:auto 100%; }
    .clock { width:min(60vw, 340px); top:66%; }
  }
</style>
</head>
<body>
<div class="scene">
  <div class="title">Live Time</div>

  <div class="clock" id="clock">
    <div class="dial" id="dial"></div>
    <div class="digital" id="digital"></div>
  </div>

  <div class="tz-panel monaco">
    <div class="mp-label">Monaco</div>
    <div class="mp-time" id="monaco-time"></div>
    <div class="mp-date" id="monaco-date"></div>
  </div>

  <div class="tz-panel india">
    <div class="mp-label">India</div>
    <div class="mp-time" id="india-time"></div>
    <div class="mp-date" id="india-date"></div>
  </div>

  <div class="tz-panel london">
    <div class="mp-label">London</div>
    <div class="mp-time" id="london-time"></div>
    <div class="mp-date" id="london-date"></div>
  </div>
</div>

<script>
const dial = document.getElementById('dial');
const clock = document.getElementById('clock');
const digital = document.getElementById('digital');

for (let i = 0; i < 60; i++) {
  const t = document.createElement('div');
  t.className = 'tick' + (i % 5 === 0 ? ' major' : '');
  t.style.transform = `translate(-50%,-100%) rotate(${i*6}deg)`;
  dial.appendChild(t);
}

const roman = ['XII','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'];
roman.forEach((n, i) => {
  const el = document.createElement('div');
  el.className = 'number';
  const a = i * 30 * Math.PI / 180;
  const r = 38;
  el.style.left = `${50 + Math.sin(a)*r}%`;
  el.style.top  = `${50 - Math.cos(a)*r}%`;
  el.textContent = n;
  dial.appendChild(el);
});

['hour','minute','second'].forEach(cls => {
  const h = document.createElement('div');
  h.className = 'hand ' + cls;
  h.id = cls;
  dial.appendChild(h);
});
const pin = document.createElement('div');
pin.className = 'pin';
dial.appendChild(pin);

const monacoTime = document.getElementById('monaco-time');
const monacoDate = document.getElementById('monaco-date');
const indiaTime  = document.getElementById('india-time');
const indiaDate  = document.getElementById('india-date');
const londonTime = document.getElementById('london-time');
const londonDate = document.getElementById('london-date');

function tzDisplay(now, tz, timeEl, dateEl) {
  const d = new Date(now.toLocaleString('en-US', {timeZone: tz}));
  timeEl.textContent = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  dateEl.textContent = d.toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'});
}

function updateClock() {
  const now = new Date();
  const ms = now.getMilliseconds();
  const s = now.getSeconds() + ms/1000;
  const m = now.getMinutes() + s/60;
  const h = (now.getHours()%12) + m/60;

  document.getElementById('second').style.transform =
    `translate(-50%,-100%) rotate(${s*6}deg)`;
  document.getElementById('minute').style.transform =
    `translate(-50%,-100%) rotate(${m*6}deg)`;
  document.getElementById('hour').style.transform =
    `translate(-50%,-100%) rotate(${h*30}deg)`;

  digital.textContent = now.toLocaleTimeString([], {
    hour:'2-digit', minute:'2-digit', second:'2-digit'
  });

  tzDisplay(now, 'Europe/Monaco',  monacoTime, monacoDate);
  tzDisplay(now, 'Asia/Kolkata',   indiaTime,  indiaDate);
  tzDisplay(now, 'Europe/London',  londonTime, londonDate);

  requestAnimationFrame(updateClock);
}
updateClock();
</script>
</body>
</html>
