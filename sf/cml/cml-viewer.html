<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salesforce Revenue Cloud — CML Viewer</title>
 <link rel="icon" type="image/x-icon" href="https://mohan-chinnappan-n5.github.io/dfv/img/mc_favIcon.ico" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d2e;
    --surface2: #242740;
    --border: #2e3250;
    --text: #e2e8f0;
    --text-muted: #8892a4;
    --accent: #6366f1;
    --accent2: #8b5cf6;

    --intent-hydration: #0ea5e9;
    --intent-persistence: #10b981;
    --intent-association: #f59e0b;
    --intent-translation: #ec4899;

    --node-salestrx: #6366f1;
    --node-asset: #10b981;
    --node-quote: #f59e0b;
    --node-order: #ec4899;
    --node-contract: #14b8a6;
    --node-other: #8b5cf6;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
    height: 100vh;
    user-select: none;
  }

  /* ── Top bar ── */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 56px;
    background: rgba(15, 17, 23, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px; padding: 0 20px;
  }
  #topbar h1 {
    font-size: 15px; font-weight: 600; white-space: nowrap;
    background: linear-gradient(135deg, #6366f1, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  #topbar .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
    background: var(--surface2); color: var(--text-muted); white-space: nowrap;
  }
  #search {
    flex: 1; max-width: 360px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 6px 12px;
    font-size: 13px; outline: none;
  }
  #search:focus { border-color: var(--accent); }
  .sep { width: 1px; height: 28px; background: var(--border); }
  .ctrl-btn {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; padding: 5px 10px;
    font-size: 12px; cursor: pointer; transition: background .15s;
    white-space: nowrap;
  }
  .ctrl-btn:hover { background: var(--surface); }
  #zoom-label { font-size: 12px; color: var(--text-muted); min-width: 42px; text-align: center; }

  /* ── Canvas ── */
  #canvas-wrap {
    position: fixed; inset: 56px 0 0 0;
    overflow: hidden; cursor: grab;
  }
  #canvas-wrap.panning { cursor: grabbing; }
  #world {
    position: absolute; top: 0; left: 0;
    transform-origin: 0 0;
    will-change: transform;
  }

  /* ── Cards ── */
  .card {
    position: absolute;
    width: 340px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: box-shadow .2s, border-color .2s;
    cursor: default;
  }
  .card:hover {
    border-color: #4a507a;
    box-shadow: 0 8px 32px rgba(0,0,0,.5);
  }
  .card.expanded { width: 540px; }
  .card.highlighted { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(99,102,241,.3); }

  .card-header {
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .card-header:hover { background: rgba(255,255,255,.03); }
  .card-title {
    font-size: 13px; font-weight: 600; margin-bottom: 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .card-title .dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .card-desc {
    font-size: 11px; color: var(--text-muted); line-height: 1.4;
  }

  .intents-row {
    padding: 8px 14px;
    display: flex; flex-wrap: wrap; gap: 4px;
    border-bottom: 1px solid var(--border);
  }
  .intent-badge {
    font-size: 10px; font-weight: 600; padding: 2px 7px;
    border-radius: 10px; text-transform: uppercase; letter-spacing: .5px;
  }
  .intent-hydration   { background: rgba(14,165,233,.15); color: var(--intent-hydration); border: 1px solid rgba(14,165,233,.3); }
  .intent-persistence { background: rgba(16,185,129,.15); color: var(--intent-persistence); border: 1px solid rgba(16,185,129,.3); }
  .intent-association { background: rgba(245,158,11,.15);  color: var(--intent-association); border: 1px solid rgba(245,158,11,.3); }
  .intent-translation { background: rgba(236,72,153,.15);  color: var(--intent-translation); border: 1px solid rgba(236,72,153,.3); }

  .node-mappings { padding: 8px 0; }
  .node-mapping-item {
    padding: 6px 14px;
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,.04);
    transition: background .12s;
  }
  .node-mapping-item:hover { background: rgba(255,255,255,.04); }
  .node-mapping-item:last-child { border-bottom: none; }
  .nm-node {
    font-weight: 600; padding: 2px 6px; border-radius: 4px;
    font-size: 10px; flex-shrink: 0;
  }
  .nm-arrow { color: var(--text-muted); flex-shrink: 0; font-size: 12px; }
  .nm-object { color: var(--text-muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nm-count { font-size: 10px; color: var(--text-muted); flex-shrink: 0; }

  .attr-table { display: none; }
  .attr-table.open {
    display: block;
    border-top: 1px solid var(--border);
    max-height: 280px; overflow-y: auto;
    background: rgba(0,0,0,.2);
  }
  .attr-table::-webkit-scrollbar { width: 4px; }
  .attr-table::-webkit-scrollbar-track { background: transparent; }
  .attr-table::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .attr-row {
    display: grid; grid-template-columns: 1fr 18px 1fr;
    gap: 4px; align-items: center;
    padding: 4px 14px; font-size: 10px;
    border-bottom: 1px solid rgba(255,255,255,.03);
  }
  .attr-row:hover { background: rgba(255,255,255,.03); }
  .attr-from { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attr-to   { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
  .attr-arr  { color: var(--accent); text-align: center; }

  .card-footer {
    padding: 7px 14px;
    border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 10px; color: var(--text-muted);
    background: rgba(0,0,0,.15);
  }
  .inherited-tag {
    font-size: 9px; color: var(--text-muted); opacity: .6;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 230px;
  }

  /* ── Context Nodes section ── */
  .section-card {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .section-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
  }
  .section-header:hover { background: rgba(255,255,255,.03); }
  .section-title { font-size: 13px; font-weight: 600; }
  .section-subtitle { font-size: 11px; color: var(--text-muted); }

  .nodes-grid {
    display: none; padding: 12px;
    gap: 6px;
    max-height: 500px; overflow-y: auto;
  }
  .nodes-grid.open { display: grid; grid-template-columns: repeat(2, 1fr); }
  .nodes-grid::-webkit-scrollbar { width: 4px; }
  .nodes-grid::-webkit-scrollbar-thumb { background: var(--border); }

  .node-attr-chip {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 8px;
    font-size: 10px;
  }
  .nac-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nac-meta { color: var(--text-muted); display: flex; gap: 6px; margin-top: 2px; }
  .nac-type { font-size: 9px; padding: 1px 5px; border-radius: 3px; background: rgba(99,102,241,.15); color: var(--accent); }
  .nac-field { font-size: 9px; color: #64748b; }

  /* ── Mini-map ── */
  #minimap {
    position: fixed; bottom: 20px; right: 20px; z-index: 90;
    width: 180px; height: 110px;
    background: rgba(15, 17, 23, 0.9);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  #minimap canvas { width: 100%; height: 100%; }
  #minimap-label {
    position: absolute; top: 4px; left: 6px;
    font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;
  }

  /* ── Stats panel ── */
  #stats {
    position: fixed; bottom: 20px; left: 20px; z-index: 90;
    display: flex; flex-direction: column; gap: 4px;
  }
  .stat-pill {
    background: rgba(15, 17, 23, 0.9);
    border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 12px;
    font-size: 11px; color: var(--text-muted);
    display: flex; align-items: center; gap: 6px;
  }
  .stat-pill strong { color: var(--text); }

  /* ── Drop overlay ── */
  #drop-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(15, 17, 23, 0.97);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 24px;
  }
  #drop-overlay.hidden { display: none; }
  .drop-box {
    width: 420px; padding: 48px;
    border: 2px dashed var(--border);
    border-radius: 16px;
    text-align: center;
    transition: border-color .2s, background .2s;
  }
  .drop-box.dragover { border-color: var(--accent); background: rgba(99,102,241,.06); }
  .drop-icon { font-size: 48px; margin-bottom: 16px; }
  .drop-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  .drop-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
  #file-input { display: none; }
  .drop-btn {
    background: var(--accent); color: white; border: none;
    padding: 10px 24px; border-radius: 8px; font-size: 13px;
    cursor: pointer; font-weight: 600;
    transition: background .15s;
  }
  .drop-btn:hover { background: var(--accent2); }
  .drop-hint { font-size: 11px; color: var(--text-muted); }

  /* ── SVG connections ── */
  #connections-svg {
    position: absolute; top: 0; left: 0;
    pointer-events: none; overflow: visible;
  }
  .conn-line {
    fill: none; stroke: rgba(99,102,241,.3); stroke-width: 1.5;
    stroke-dasharray: 5,4;
  }

  /* ── Toast ── */
  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 16px;
    font-size: 12px; z-index: 300;
    transition: opacity .3s;
  }
  #toast.hide { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<!-- Drop overlay -->
<div id="drop-overlay">
  <div style="text-align:center">
    <div style="font-size:32px;font-weight:700;background:linear-gradient(135deg,#6366f1,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px">CML Viewer</div>
    <div style="font-size:13px;color:#8892a4">Salesforce Revenue Cloud · Context Mapping Language</div>
  </div>
  <div class="drop-box" id="drop-box">
    <div class="drop-icon">📄</div>
    <div class="drop-title">Load your CML file</div>
    <div class="drop-sub">Drop a <code style="background:#242740;padding:2px 6px;border-radius:4px">ContextDefinition</code> XML file here<br>or click to browse</div>
    <button class="drop-btn" onclick="document.getElementById('file-input').click()">Choose File</button>
    <input type="file" id="file-input" accept=".xml">
    <div class="drop-hint" style="margin-top:16px">Supports large files · Parsed entirely in-browser</div>
  </div>
</div>

<!-- Top bar -->
<div id="topbar">
  <h1>⬡ CML Viewer</h1>
  <div class="badge" id="file-badge">No file loaded</div>
  <div class="sep"></div>
  <input type="text" id="search" placeholder="Search mappings, nodes, attributes…">
  <div class="sep"></div>
  <button class="ctrl-btn" onclick="resetView()">⌖ Reset</button>
  <button class="ctrl-btn" onclick="zoomOut()">−</button>
  <div id="zoom-label">100%</div>
  <button class="ctrl-btn" onclick="zoomIn()">+</button>
  <div class="sep"></div>
  <button class="ctrl-btn" onclick="toggleConnections()">↗ Links</button>
  <button class="ctrl-btn" id="layout-btn" onclick="cycleLayout()">⊞ Layout</button>
  <button class="ctrl-btn" onclick="exportSVG()" style="background:rgba(99,102,241,.18);border-color:rgba(99,102,241,.4);color:#a5b4fc">⬇ SVG</button>
  <button class="ctrl-btn" onclick="document.getElementById('file-input').click()">Open…</button>
</div>

<!-- Canvas -->
<div id="canvas-wrap">
  <div id="world">
    <svg id="connections-svg"></svg>
  </div>
</div>

<!-- Mini-map -->
<div id="minimap">
  <canvas id="minimap-canvas"></canvas>
  <div id="minimap-label">map</div>
</div>

<!-- Stats -->
<div id="stats">
  <div class="stat-pill" id="stat-mappings">Mappings: <strong>0</strong></div>
  <div class="stat-pill" id="stat-attrs">Attributes: <strong>0</strong></div>
  <div class="stat-pill" id="stat-nodes">Context Nodes: <strong>0</strong></div>
</div>

<div id="toast" class="hide"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────
let panX = 80, panY = 80, zoom = 1;
let isPanning = false, lastMX = 0, lastMY = 0;
let showConns = true;
let layoutMode = 0; // 0=grid, 1=flow, 2=compact
let allCards = []; // {el, x, y, w, h, id, type}
let parsedData = null;

const world = document.getElementById('world');
const canvasWrap = document.getElementById('canvas-wrap');
const connSvg = document.getElementById('connections-svg');
const CARD_W = 340, CARD_GAP = 40;

// ── Color helpers ──────────────────────────────────────────────────────
const TITLE_COLORS = {
  salestrx: '#6366f1', sales: '#6366f1',
  asset: '#10b981',
  quote: '#f59e0b',
  order: '#ec4899',
  contract: '#14b8a6',
  product: '#a78bfa',
  default: '#8b5cf6'
};

function colorForTitle(t) {
  t = (t||'').toLowerCase();
  if (t.includes('salestransaction') || t.includes('salestrx')) return TITLE_COLORS.salestrx;
  if (t.includes('asset')) return TITLE_COLORS.asset;
  if (t.includes('quote')) return TITLE_COLORS.quote;
  if (t.includes('order')) return TITLE_COLORS.order;
  if (t.includes('contract')) return TITLE_COLORS.contract;
  if (t.includes('product') || t.includes('discovery')) return TITLE_COLORS.product;
  return TITLE_COLORS.default;
}

// ── XML parsing ────────────────────────────────────────────────────────
function getT(parent, tag) {
  const el = parent.getElementsByTagName(tag)[0];
  return el ? (el.childNodes[0]?.nodeValue||'').trim() : '';
}
function getAll(parent, tag) {
  return Array.from(parent.children).filter(c => c.tagName === tag);
}

function parseXML(xmlStr) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlStr, 'application/xml');
  const root = doc.documentElement;

  const data = {
    canBeRef: getT(root, 'canBeReferenceDefinition'),
    references: [],
    mappings: [],
    contextNodes: [],
    nodeCount: 0,
    attrCount: 0
  };

  // References
  getAll(root, 'contextDefinitionReferences').forEach(r => {
    data.references.push({
      inheritedFrom: getT(r, 'inheritedFrom'),
      refDef: getT(r, 'referenceContextDefinition')
    });
  });

  // Version block
  const versionBlock = root.getElementsByTagName('contextDefinitionVersions')[0];
  if (!versionBlock) return data;

  // Context Mappings
  getAll(versionBlock, 'contextMappings').forEach(cm => {
    const intents = getAll(cm, 'contextMappingIntents').map(i => getT(i, 'mappingIntent'));
    const nodeMappings = getAll(cm, 'contextNodeMappings').map(nm => {
      const attrs = getAll(nm, 'contextAttributeMappings').map(a => ({
        attr: getT(a, 'contextAttribute'),
        inputName: getT(a, 'contextInputAttributeName'),
        hydCtx: getT(a, 'contextQueryAttribute'),
        inheritedFrom: getT(a, 'inheritedFrom'),
        objectName: getT(a, 'objectName'),
        queryAttr: getT(a, 'queryAttribute')
      }));
      return {
        contextNode: getT(nm, 'contextNode'),
        mappedContextDef: getT(nm, 'mappedContextDefinition'),
        object: getT(nm, 'object'),
        inheritedFrom: getT(nm, 'inheritedFrom'),
        attrs
      };
    });
    data.mappings.push({
      title: getT(cm, 'title'),
      description: getT(cm, 'description'),
      default: getT(cm, 'default'),
      inheritedFrom: getT(cm, 'inheritedFrom'),
      intents,
      nodeMappings
    });
  });

  // Context Nodes (attribute definitions)
  const ctxNodesEl = versionBlock.getElementsByTagName('contextNodes')[0];
  if (ctxNodesEl) {
    getAll(ctxNodesEl, 'contextAttributes').forEach(ca => {
      data.contextNodes.push({
        title: getT(ca, 'title'),
        dataType: getT(ca, 'dataType'),
        fieldType: getT(ca, 'fieldType'),
        key: getT(ca, 'key'),
        transient: getT(ca, 'transient'),
        value: getT(ca, 'value'),
        customMappingAllowed: getT(ca, 'customMappingAllowed'),
        inheritedFrom: getT(ca, 'inheritedFrom')
      });
    });
  }

  data.nodeCount = data.contextNodes.length;
  data.attrCount = data.mappings.reduce((s, m) => s + m.nodeMappings.reduce((ss, nm) => ss + nm.attrs.length, 0), 0);

  return data;
}

// ── Card building ──────────────────────────────────────────────────────
function buildMappingCard(mapping, idx) {
  const div = document.createElement('div');
  div.className = 'card';
  div.dataset.id = 'mapping-' + idx;
  div.dataset.searchText = [
    mapping.title, mapping.description,
    mapping.intents.join(' '),
    mapping.nodeMappings.map(nm => nm.contextNode + ' ' + nm.object).join(' ')
  ].join(' ').toLowerCase();

  const color = colorForTitle(mapping.title);
  const totalAttrs = mapping.nodeMappings.reduce((s, nm) => s + nm.attrs.length, 0);

  div.innerHTML = `
    <div class="card-header" onclick="toggleCard(this)">
      <div class="card-title">
        <span class="dot" style="background:${color}"></span>
        ${escH(mapping.title) || '<em style="opacity:.5">Untitled</em>'}
        <span style="font-size:10px;color:#8892a4;font-weight:400;margin-left:auto">${totalAttrs} attrs</span>
      </div>
      ${mapping.description ? `<div class="card-desc">${escH(truncate(mapping.description, 80))}</div>` : ''}
    </div>
    <div class="intents-row">
      ${mapping.intents.map(i => `<span class="intent-badge intent-${i}">${escH(i)}</span>`).join('')}
      ${mapping.default === 'true' ? '<span class="intent-badge" style="background:rgba(255,255,255,.05);color:#8892a4;border:1px solid rgba(255,255,255,.1)">default</span>' : ''}
    </div>
    <div class="node-mappings">
      ${mapping.nodeMappings.map((nm, ni) => `
        <div class="node-mapping-item" onclick="toggleAttrs(this, ${idx}, ${ni})">
          <span class="nm-node" style="background:${color}22;color:${color};border:1px solid ${color}44">${escH(nm.contextNode)||'—'}</span>
          <span class="nm-arrow">→</span>
          <span class="nm-object">${escH(nm.object||nm.mappedContextDef||'—')}</span>
          <span class="nm-count">${nm.attrs.length}⁠ ↓</span>
        </div>
        <div class="attr-table" data-mapping="${idx}" data-nm="${ni}"></div>
      `).join('')}
    </div>
    <div class="card-footer">
      <span class="inherited-tag" title="${escH(mapping.inheritedFrom)}">${escH(mapping.inheritedFrom ? '↑ ' + mapping.inheritedFrom : '')}</span>
    </div>
  `;

  return div;
}

function toggleCard(headerEl) {
  const card = headerEl.closest('.card');
  card.classList.toggle('expanded');
}

function toggleAttrs(rowEl, mappingIdx, nmIdx) {
  const tableEl = rowEl.nextElementSibling;
  if (tableEl.classList.contains('open')) {
    tableEl.classList.remove('open');
    return;
  }
  // Build if empty
  if (!tableEl.innerHTML) {
    const nm = parsedData.mappings[mappingIdx].nodeMappings[nmIdx];
    tableEl.innerHTML = nm.attrs.map(a => `
      <div class="attr-row">
        <span class="attr-from" title="${escH(a.attr)}">${escH(a.attr)}</span>
        <span class="attr-arr">→</span>
        <span class="attr-to" title="${escH(a.inputName)}">${escH(a.hydCtx || a.inputName)}</span>
      </div>
    `).join('');
  }
  tableEl.classList.add('open');
}

function buildNodesCard(nodes) {
  const div = document.createElement('div');
  div.className = 'section-card';
  div.dataset.id = 'ctx-nodes';
  div.style.width = '720px';

  div.innerHTML = `
    <div class="section-header" onclick="toggleSection(this)">
      <div>
        <div class="section-title">⬡ Context Attribute Definitions</div>
        <div class="section-subtitle">${nodes.length} attributes defined in this context</div>
      </div>
      <span style="font-size:18px;color:#8892a4">▾</span>
    </div>
    <div class="nodes-grid">
      ${nodes.map(n => `
        <div class="node-attr-chip">
          <div class="nac-title" title="${escH(n.title)}">${escH(n.title)}</div>
          <div class="nac-meta">
            <span class="nac-type">${escH(n.dataType||'?')}</span>
            <span class="nac-field">${escH(n.fieldType)}</span>
            ${n.key==='true'?'<span style="font-size:9px;color:#f59e0b">🔑 key</span>':''}
          </div>
        </div>
      `).join('')}
    </div>
  `;
  return div;
}

function toggleSection(headerEl) {
  const grid = headerEl.nextElementSibling;
  grid.classList.toggle('open');
  const arrow = headerEl.querySelector('span:last-child');
  arrow.textContent = grid.classList.contains('open') ? '▴' : '▾';
}

// ── Layout ─────────────────────────────────────────────────────────────
const LAYOUTS = ['grid', 'flow', 'compact'];

function layoutCards() {
  const mode = LAYOUTS[layoutMode];
  allCards = [];

  if (mode === 'grid') {
    const cols = 4;
    parsedData.mappings.forEach((m, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      allCards.push({ x: col * (CARD_W + CARD_GAP), y: row * 420 + 20, id: 'mapping-' + i });
    });
    if (parsedData.contextNodes.length) {
      const rows = Math.ceil(parsedData.mappings.length / cols);
      allCards.push({ x: 0, y: rows * 420 + 60, id: 'ctx-nodes' });
    }
  } else if (mode === 'flow') {
    // Group by category
    const groups = { salestrx: [], asset: [], quote: [], order: [], contract: [], other: [] };
    parsedData.mappings.forEach((m, i) => {
      const t = (m.title||'').toLowerCase();
      if (t.includes('salestransaction') || t.includes('salestrx')) groups.salestrx.push(i);
      else if (t.includes('asset')) groups.asset.push(i);
      else if (t.includes('quote')) groups.quote.push(i);
      else if (t.includes('order')) groups.order.push(i);
      else if (t.includes('contract')) groups.contract.push(i);
      else groups.other.push(i);
    });
    let gx = 0;
    Object.entries(groups).forEach(([, idxs]) => {
      if (!idxs.length) return;
      idxs.forEach((i, j) => {
        allCards.push({ x: gx, y: j * 420 + 20, id: 'mapping-' + i });
      });
      gx += CARD_W + CARD_GAP * 2;
    });
    allCards.push({ x: 0, y: Math.max(...allCards.map(c => c.y)) + 480, id: 'ctx-nodes' });
  } else {
    // compact: tighter grid
    const cols = 5;
    parsedData.mappings.forEach((m, i) => {
      allCards.push({ x: (i % cols) * (CARD_W + 20), y: Math.floor(i / cols) * 380 + 20, id: 'mapping-' + i });
    });
    allCards.push({ x: 0, y: Math.ceil(parsedData.mappings.length / cols) * 380 + 60, id: 'ctx-nodes' });
  }

  // Apply positions
  allCards.forEach(c => {
    const el = world.querySelector(`[data-id="${c.id}"]`);
    if (el) {
      el.style.left = c.x + 'px';
      el.style.top = c.y + 'px';
    }
  });

  drawConnections();
  updateMinimap();
}

function cycleLayout() {
  layoutMode = (layoutMode + 1) % LAYOUTS.length;
  const btn = document.getElementById('layout-btn');
  btn.textContent = ['⊞ Grid', '⋮⊞ Flow', '⊟ Compact'][layoutMode];
  layoutCards();
  showToast('Layout: ' + LAYOUTS[layoutMode]);
}

// ── Connections ────────────────────────────────────────────────────────
function drawConnections() {
  connSvg.innerHTML = '';
  if (!showConns || !parsedData) return;

  // Draw lines between cards that share context nodes
  const nodeToCards = {};
  parsedData.mappings.forEach((m, i) => {
    m.nodeMappings.forEach(nm => {
      const key = (nm.contextNode || nm.object || '').toLowerCase();
      if (key) {
        if (!nodeToCards[key]) nodeToCards[key] = [];
        nodeToCards[key].push(i);
      }
    });
  });

  const drawn = new Set();
  Object.values(nodeToCards).forEach(cardIdxs => {
    for (let a = 0; a < cardIdxs.length; a++) {
      for (let b = a + 1; b < cardIdxs.length; b++) {
        const key = `${cardIdxs[a]}-${cardIdxs[b]}`;
        if (drawn.has(key)) continue;
        drawn.add(key);

        const ca = allCards.find(c => c.id === 'mapping-' + cardIdxs[a]);
        const cb = allCards.find(c => c.id === 'mapping-' + cardIdxs[b]);
        if (!ca || !cb) continue;

        const ax = ca.x + CARD_W / 2, ay = ca.y + 60;
        const bx = cb.x + CARD_W / 2, by = cb.y + 60;
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const cp = Math.abs(bx - ax) * 0.4;
        path.setAttribute('d', `M${ax},${ay} C${ax+cp},${ay} ${bx-cp},${by} ${bx},${by}`);
        path.setAttribute('class', 'conn-line');
        path.setAttribute('opacity', '0.4');
        connSvg.appendChild(path);
      }
    }
  });
}

function toggleConnections() {
  showConns = !showConns;
  drawConnections();
  showToast('Links ' + (showConns ? 'on' : 'off'));
}

// ── Render ─────────────────────────────────────────────────────────────
function renderData(data) {
  parsedData = data;

  // Clear world (keep svg)
  Array.from(world.children).forEach(c => { if (c.id !== 'connections-svg') c.remove(); });
  allCards = [];

  // Build mapping cards
  data.mappings.forEach((m, i) => {
    const card = buildMappingCard(m, i);
    world.appendChild(card);
  });

  // Build context nodes card
  if (data.contextNodes.length) {
    const nc = buildNodesCard(data.contextNodes);
    world.appendChild(nc);
  }

  // Update stats
  document.getElementById('stat-mappings').innerHTML = `Mappings: <strong>${data.mappings.length}</strong>`;
  document.getElementById('stat-attrs').innerHTML = `Attributes: <strong>${data.attrCount}</strong>`;
  document.getElementById('stat-nodes').innerHTML = `Context Nodes: <strong>${data.nodeCount}</strong>`;

  layoutCards();
  resetView();
}

// ── Search ─────────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  world.querySelectorAll('.card').forEach(card => {
    if (!q) {
      card.classList.remove('highlighted');
      card.style.opacity = '1';
    } else {
      const text = card.dataset.searchText || '';
      const match = text.includes(q);
      card.classList.toggle('highlighted', match);
      card.style.opacity = match ? '1' : '0.25';
    }
  });
});

// ── Pan & Zoom ─────────────────────────────────────────────────────────
function applyTransform() {
  world.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
  document.getElementById('zoom-label').textContent = Math.round(zoom * 100) + '%';
  updateMinimap();
}

canvasWrap.addEventListener('mousedown', e => {
  if (e.target.closest('.card') || e.target.closest('.section-card')) return;
  isPanning = true;
  lastMX = e.clientX; lastMY = e.clientY;
  canvasWrap.classList.add('panning');
});
window.addEventListener('mousemove', e => {
  if (!isPanning) return;
  panX += e.clientX - lastMX;
  panY += e.clientY - lastMY;
  lastMX = e.clientX; lastMY = e.clientY;
  applyTransform();
});
window.addEventListener('mouseup', () => {
  isPanning = false;
  canvasWrap.classList.remove('panning');
});

canvasWrap.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  const rect = canvasWrap.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  panX = mx - (mx - panX) * factor;
  panY = my - (my - panY) * factor;
  zoom = Math.max(0.1, Math.min(3, zoom * factor));
  applyTransform();
}, { passive: false });

function zoomIn() { zoom = Math.min(3, zoom * 1.2); applyTransform(); }
function zoomOut() { zoom = Math.max(0.1, zoom / 1.2); applyTransform(); }
function resetView() {
  panX = 80; panY = 80; zoom = 0.75;
  applyTransform();
}

// ── Mini-map ───────────────────────────────────────────────────────────
function updateMinimap() {
  const canvas = document.getElementById('minimap-canvas');
  const ctx = canvas.getContext('2d');
  const W = 180, H = 110;
  canvas.width = W; canvas.height = H;
  ctx.clearRect(0, 0, W, H);

  if (!allCards.length) return;

  const maxX = Math.max(...allCards.map(c => c.x + (c.id === 'ctx-nodes' ? 720 : CARD_W)));
  const maxY = Math.max(...allCards.map(c => c.y + 380));
  const scaleX = W / maxX, scaleY = H / maxY;
  const s = Math.min(scaleX, scaleY) * 0.9;

  allCards.forEach(c => {
    const cw = c.id === 'ctx-nodes' ? 720 : CARD_W;
    const color = c.id === 'ctx-nodes' ? '#4a507a' : colorForTitle(
      parsedData?.mappings[parseInt(c.id.replace('mapping-',''))]?.title || ''
    );
    ctx.fillStyle = color + '55';
    ctx.strokeStyle = color + 'aa';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.roundRect(c.x * s + 4, c.y * s + 4, cw * s, 60 * s, 2);
    ctx.fill();
    ctx.stroke();
  });

  // Viewport indicator
  const vpW = canvasWrap.offsetWidth / zoom * s;
  const vpH = (canvasWrap.offsetHeight) / zoom * s;
  const vpX = (-panX / zoom) * s;
  const vpY = (-panY / zoom) * s;
  ctx.strokeStyle = 'rgba(99,102,241,0.8)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.rect(vpX + 4, vpY + 4, vpW, vpH);
  ctx.stroke();
}

// ── File loading ───────────────────────────────────────────────────────
function loadFile(file) {
  if (!file) return;
  showToast('Parsing ' + file.name + '…');
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = parseXML(e.target.result);
      document.getElementById('drop-overlay').classList.add('hidden');
      document.getElementById('file-badge').textContent = file.name + ' · ' + data.mappings.length + ' mappings';
      renderData(data);
      showToast('Loaded ' + data.mappings.length + ' mappings, ' + data.attrCount + ' attributes');
    } catch(err) {
      showToast('Parse error: ' + err.message);
    }
  };
  reader.readAsText(file);
}

document.getElementById('file-input').addEventListener('change', e => loadFile(e.target.files[0]));

const dropBox = document.getElementById('drop-box');
document.addEventListener('dragover', e => { e.preventDefault(); dropBox.classList.add('dragover'); });
document.addEventListener('dragleave', () => dropBox.classList.remove('dragover'));
document.addEventListener('drop', e => {
  e.preventDefault();
  dropBox.classList.remove('dragover');
  const file = e.dataTransfer?.files[0];
  if (file?.name.endsWith('.xml')) loadFile(file);
  else showToast('Please drop an XML file');
});

// Also allow drag onto canvas wrap when file is loaded
canvasWrap.addEventListener('dragover', e => e.preventDefault());
canvasWrap.addEventListener('drop', e => {
  e.preventDefault();
  const file = e.dataTransfer?.files[0];
  if (file?.name.endsWith('.xml')) loadFile(file);
});

// ── Toast ──────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hide');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hide'), 2500);
}

// ── SVG Export ─────────────────────────────────────────────────────────
function exportSVG() {
  if (!parsedData) { showToast('No data loaded'); return; }
  showToast('Building SVG…');

  // Constants matching card layout
  const FONT   = "'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif";
  const BG     = '#0f1117';
  const SURF   = '#1a1d2e';
  const SURF2  = '#242740';
  const BORDER = '#2e3250';
  const TEXT   = '#e2e8f0';
  const MUTED  = '#8892a4';
  const ACCENT = '#6366f1';

  const INTENT_COLORS = {
    hydration:   { bg: 'rgba(14,165,233,.15)',  fg: '#0ea5e9', br: 'rgba(14,165,233,.3)'  },
    persistence: { bg: 'rgba(16,185,129,.15)',  fg: '#10b981', br: 'rgba(16,185,129,.3)'  },
    association: { bg: 'rgba(245,158,11,.15)',  fg: '#f59e0b', br: 'rgba(245,158,11,.3)'  },
    translation: { bg: 'rgba(236,72,153,.15)',  fg: '#ec4899', br: 'rgba(236,72,153,.3)'  },
  };

  // ── measure helpers (all units in px) ─────────────────────────────────
  const CW     = 420;   // card width
  const PAD    = 14;
  const R      = 10;    // corner radius
  const LH_SM  = 13;    // small line height
  const LH_MD  = 16;
  const LH_LG  = 18;
  const COL_GAP = 50;
  const ROW_GAP = 40;
  const COLS   = 4;
  const NODES_W = COLS * (CW + COL_GAP) - COL_GAP;

  // Escape XML text
  function x(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // Measure card height (fully expanded)
  function cardHeight(mapping) {
    let h = 0;
    // header
    h += 12 + LH_LG + 6; // top padding + title + gap
    if (mapping.description) h += LH_SM + 4;
    h += 10; // header bottom padding
    h += 1;  // border
    // intents row
    h += 8 + LH_SM + 8 + 1;
    // node mappings
    mapping.nodeMappings.forEach(nm => {
      h += 6 + LH_MD + 6 + 1; // row item
      // attr rows
      nm.attrs.forEach(() => { h += 4 + LH_SM + 4 + 1; });
    });
    // footer
    h += 1 + 7 + LH_SM + 7;
    return h;
  }

  // Measure nodes card height
  function nodesCardHeight(nodes) {
    const CHIP_H = 46, CHIP_COLS = 4;
    const rows = Math.ceil(nodes.length / CHIP_COLS);
    return 44 + 1 + 12 + rows * (CHIP_H + 6) + 12;
  }

  // ── compute positions ──────────────────────────────────────────────────
  const positions = [];
  parsedData.mappings.forEach((m, i) => {
    const col = i % COLS;
    const row = Math.floor(i / COLS);
    // compute y: need to know max height of cards in previous rows
    let y = 80;
    for (let r = 0; r < row; r++) {
      let maxH = 0;
      for (let c = 0; c < COLS; c++) {
        const idx = r * COLS + c;
        if (idx < parsedData.mappings.length) maxH = Math.max(maxH, cardHeight(parsedData.mappings[idx]));
      }
      y += maxH + ROW_GAP;
    }
    positions.push({ x: 80 + col * (CW + COL_GAP), y });
  });

  // Nodes card y: bottom of last mapping row
  let nodesY = 80;
  const totalRows = Math.ceil(parsedData.mappings.length / COLS);
  for (let r = 0; r < totalRows; r++) {
    let maxH = 0;
    for (let c = 0; c < COLS; c++) {
      const idx = r * COLS + c;
      if (idx < parsedData.mappings.length) maxH = Math.max(maxH, cardHeight(parsedData.mappings[idx]));
    }
    nodesY += maxH + ROW_GAP;
  }
  nodesY += 40;

  // Total canvas
  const totalW  = 80 + COLS * (CW + COL_GAP) + 80;
  const totalH  = nodesY + nodesCardHeight(parsedData.contextNodes) + 100;

  // ── SVG builder ────────────────────────────────────────────────────────
  const parts = [];
  const p = s => parts.push(s);

  p(`<svg xmlns="http://www.w3.org/2000/svg" width="${totalW}" height="${totalH}" font-family="${FONT}">`);
  p(`<rect width="${totalW}" height="${totalH}" fill="${BG}"/>`);

  // Title
  p(`<text x="80" y="52" font-size="18" font-weight="700" fill="${ACCENT}">CML Viewer — ${x(document.getElementById('file-badge').textContent)}</text>`);

  // Connection lines (between card centres for shared contextNodes)
  const nodeToCards = {};
  parsedData.mappings.forEach((m, i) => {
    m.nodeMappings.forEach(nm => {
      const key = (nm.contextNode || nm.object || '').toLowerCase();
      if (key) { if (!nodeToCards[key]) nodeToCards[key] = []; nodeToCards[key].push(i); }
    });
  });
  const drawn = new Set();
  Object.values(nodeToCards).forEach(idxs => {
    for (let a = 0; a < idxs.length; a++) {
      for (let b = a + 1; b < idxs.length; b++) {
        const key = `${idxs[a]}-${idxs[b]}`;
        if (drawn.has(key)) continue; drawn.add(key);
        const pa = positions[idxs[a]], pb = positions[idxs[b]];
        if (!pa || !pb) continue;
        const ax = pa.x + CW/2, ay = pa.y + 50;
        const bx = pb.x + CW/2, by = pb.y + 50;
        const cp = Math.abs(bx - ax) * 0.4;
        p(`<path d="M${ax},${ay} C${ax+cp},${ay} ${bx-cp},${by} ${bx},${by}" fill="none" stroke="rgba(99,102,241,.25)" stroke-width="1.5" stroke-dasharray="5,4"/>`);
      }
    }
  });

  // ── Draw mapping cards ─────────────────────────────────────────────────
  parsedData.mappings.forEach((mapping, idx) => {
    const pos = positions[idx];
    const color = colorForTitle(mapping.title);
    let cy = pos.y; // running y cursor inside card

    const cardH = cardHeight(mapping);

    // Card background + border
    p(`<g>`);
    p(`<rect x="${pos.x}" y="${pos.y}" width="${CW}" height="${cardH}" rx="${R}" fill="${SURF}" stroke="${BORDER}" stroke-width="1"/>`);
    // left accent bar
    p(`<rect x="${pos.x}" y="${pos.y + R}" width="3" height="${cardH - R*2}" rx="1.5" fill="${color}"/>`);

    cy += 12;

    // Title row
    p(`<circle cx="${pos.x + PAD + 12}" cy="${cy + 7}" r="4" fill="${color}"/>`);
    p(`<text x="${pos.x + PAD + 24}" y="${cy + LH_LG - 4}" font-size="13" font-weight="600" fill="${TEXT}">${x(mapping.title)}</text>`);
    const totalAttrs = mapping.nodeMappings.reduce((s, nm) => s + nm.attrs.length, 0);
    p(`<text x="${pos.x + CW - PAD}" y="${cy + LH_LG - 4}" font-size="10" fill="${MUTED}" text-anchor="end">${totalAttrs} attrs</text>`);
    cy += LH_LG + 6;

    // Description
    if (mapping.description) {
      p(`<text x="${pos.x + PAD}" y="${cy + LH_SM}" font-size="10" fill="${MUTED}">${x(truncate(mapping.description, 72))}</text>`);
      cy += LH_SM + 4;
    }
    cy += 10;

    // Header border
    p(`<line x1="${pos.x}" y1="${cy}" x2="${pos.x+CW}" y2="${cy}" stroke="${BORDER}" stroke-width="1"/>`);
    cy += 1;

    // Intents row
    cy += 8;
    let ix = pos.x + PAD;
    mapping.intents.forEach(intent => {
      const ic = INTENT_COLORS[intent] || { bg: 'rgba(255,255,255,.05)', fg: MUTED, br: 'rgba(255,255,255,.1)' };
      const tw = intent.length * 6.5 + 14;
      p(`<rect x="${ix}" y="${cy}" width="${tw}" height="${LH_SM + 4}" rx="6" fill="${ic.bg}" stroke="${ic.br}" stroke-width="1"/>`);
      p(`<text x="${ix + tw/2}" y="${cy + LH_SM}" font-size="9" font-weight="600" fill="${ic.fg}" text-anchor="middle" dominant-baseline="auto">${x(intent.toUpperCase())}</text>`);
      ix += tw + 5;
    });
    cy += LH_SM + 4 + 8;

    // Intents border
    p(`<line x1="${pos.x}" y1="${cy}" x2="${pos.x+CW}" y2="${cy}" stroke="${BORDER}" stroke-width="1"/>`);
    cy += 1;

    // Node mappings
    mapping.nodeMappings.forEach(nm => {
      cy += 6;
      // node chip
      const nodeLabel = nm.contextNode || '—';
      const chipW = nodeLabel.length * 6.2 + 14;
      p(`<rect x="${pos.x + PAD}" y="${cy}" width="${chipW}" height="${LH_SM + 4}" rx="4" fill="${color}22" stroke="${color}44" stroke-width="1"/>`);
      p(`<text x="${pos.x + PAD + chipW/2}" y="${cy + LH_SM}" font-size="9" font-weight="600" fill="${color}" text-anchor="middle">${x(nodeLabel)}</text>`);
      // arrow
      p(`<text x="${pos.x + PAD + chipW + 8}" y="${cy + LH_SM}" font-size="11" fill="${MUTED}">→</text>`);
      // object
      const objLabel = truncate(nm.object || nm.mappedContextDef || '—', 28);
      p(`<text x="${pos.x + PAD + chipW + 22}" y="${cy + LH_SM}" font-size="10" fill="${MUTED}">${x(objLabel)}</text>`);
      // count
      p(`<text x="${pos.x + CW - PAD}" y="${cy + LH_SM}" font-size="9" fill="${MUTED}" text-anchor="end">${nm.attrs.length} ↓</text>`);
      cy += LH_MD + 6;
      p(`<line x1="${pos.x}" y1="${cy}" x2="${pos.x+CW}" y2="${cy}" stroke="${BORDER}" stroke-width="0.5" opacity="0.4"/>`);
      cy += 1;

      // Attr rows (fully expanded)
      nm.attrs.forEach(a => {
        cy += 4;
        p(`<text x="${pos.x + PAD}" y="${cy + LH_SM - 2}" font-size="9" fill="${TEXT}">${x(truncate(a.attr, 34))}</text>`);
        p(`<text x="${pos.x + CW/2}" y="${cy + LH_SM - 2}" font-size="9" fill="${ACCENT}" text-anchor="middle">→</text>`);
        p(`<text x="${pos.x + CW - PAD}" y="${cy + LH_SM - 2}" font-size="9" fill="${MUTED}" text-anchor="end">${x(truncate(a.hydCtx || a.inputName, 34))}</text>`);
        cy += LH_SM + 4;
        p(`<line x1="${pos.x + PAD}" y1="${cy}" x2="${pos.x + CW - PAD}" y2="${cy}" stroke="${BORDER}" stroke-width="0.5" opacity="0.25"/>`);
        cy += 1;
      });
    });

    // Footer
    p(`<line x1="${pos.x}" y1="${cy}" x2="${pos.x+CW}" y2="${cy}" stroke="${BORDER}" stroke-width="1"/>`);
    cy += 1 + 7;
    if (mapping.inheritedFrom) {
      p(`<text x="${pos.x + PAD}" y="${cy + LH_SM - 2}" font-size="8" fill="${MUTED}" opacity="0.6">↑ ${x(truncate(mapping.inheritedFrom, 56))}</text>`);
    }

    p(`</g>`);
  });

  // ── Context Nodes card ────────────────────────────────────────────────
  if (parsedData.contextNodes.length) {
    const nx = 80, ny = nodesY;
    const CHIP_COLS = 4;
    const CHIP_W = (NODES_W - PAD * 2 - (CHIP_COLS - 1) * 8) / CHIP_COLS;
    const CHIP_H = 44;
    const ncH = nodesCardHeight(parsedData.contextNodes);

    p(`<g>`);
    p(`<rect x="${nx}" y="${ny}" width="${NODES_W}" height="${ncH}" rx="${R}" fill="${SURF}" stroke="${BORDER}" stroke-width="1"/>`);
    p(`<text x="${nx + PAD}" y="${ny + 28}" font-size="13" font-weight="600" fill="${TEXT}">Context Attribute Definitions</text>`);
    p(`<text x="${nx + PAD}" y="${ny + 42}" font-size="11" fill="${MUTED}">${parsedData.contextNodes.length} attributes defined in this context</text>`);
    p(`<line x1="${nx}" y1="${ny + 44}" x2="${nx + NODES_W}" y2="${ny + 44}" stroke="${BORDER}" stroke-width="1"/>`);

    parsedData.contextNodes.forEach((n, i) => {
      const col = i % CHIP_COLS;
      const row = Math.floor(i / CHIP_COLS);
      const cx2 = nx + PAD + col * (CHIP_W + 8);
      const cy2 = ny + 44 + 12 + row * (CHIP_H + 6);
      const typeW = (n.dataType||'?').length * 6 + 12;

      p(`<rect x="${cx2}" y="${cy2}" width="${CHIP_W}" height="${CHIP_H}" rx="6" fill="${SURF2}" stroke="${BORDER}" stroke-width="1"/>`);
      p(`<text x="${cx2 + 8}" y="${cy2 + 16}" font-size="10" font-weight="600" fill="${TEXT}">${x(truncate(n.title, 24))}</text>`);
      p(`<rect x="${cx2 + 8}" y="${cy2 + 22}" width="${typeW}" height="13" rx="3" fill="rgba(99,102,241,.15)" stroke="rgba(99,102,241,.3)" stroke-width="0.5"/>`);
      p(`<text x="${cx2 + 8 + typeW/2}" y="${cy2 + 32}" font-size="8" fill="${ACCENT}" text-anchor="middle">${x(n.dataType||'?')}</text>`);
      p(`<text x="${cx2 + 8 + typeW + 5}" y="${cy2 + 32}" font-size="8" fill="#64748b">${x(n.fieldType||'')}</text>`);
      if (n.key === 'true') {
        p(`<text x="${cx2 + CHIP_W - 8}" y="${cy2 + 32}" font-size="9" text-anchor="end">🔑</text>`);
      }
    });

    p(`</g>`);
  }

  p(`</svg>`);

  const svgStr = parts.join('\n');
  const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const fname = (document.getElementById('file-badge').textContent.split('·')[0].trim() || 'CML').replace(/\.xml$/i, '');
  a.download = fname + '-expanded.svg';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  showToast('SVG saved — ' + parsedData.mappings.length + ' cards fully expanded');
}

// ── Helpers ────────────────────────────────────────────────────────────
function escH(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function truncate(s, n) { return s && s.length > n ? s.slice(0, n) + '…' : s; }

// ── Auto-load if same directory ────────────────────────────────────────
// Attempt to auto-load DRO-CML.xml if accessed via file:// or local server
(async () => {
  try {
    const res = await fetch('DRO-CML.xml');
    if (res.ok) {
      const text = await res.text();
      const fakeFile = { name: 'DRO-CML.xml' };
      showToast('Auto-loading DRO-CML.xml…');
      try {
        const data = parseXML(text);
        document.getElementById('drop-overlay').classList.add('hidden');
        document.getElementById('file-badge').textContent = 'DRO-CML.xml · ' + data.mappings.length + ' mappings';
        renderData(data);
        showToast('Loaded ' + data.mappings.length + ' mappings · ' + data.attrCount + ' attributes');
      } catch(err) {
        console.warn('Parse error', err);
      }
    }
  } catch(e) {
    // expected when opened standalone without server
  }
})();

applyTransform();
</script>
